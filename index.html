<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Momma Money</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1f6b4a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --green:#1f6b4a; --green-dark:#164f37; --green-light:#e4f0e9;
    --gold:#d4a017; --gold-dark:#a97e0f; --gold-light:#faf1d9;
    --cream:#fbf7ee; --panel:#ffffff; --border:#e6ddc9;
    --text:#2c2a24; --text-dim:#7a7568; --red:#b3423a; --red-light:#fbe7e5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--cream);color:var(--text);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 100px;min-height:100vh;}
  header.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  header.app-header h1{font-size:1.4rem;margin:0;color:var(--green-dark);}
  header.app-header h1 .dot{color:var(--gold);}
  .icon-btn{
    border:none;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:8px 12px;font-size:1.1rem;cursor:pointer;
  }
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px;}
  .kicker{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gold-dark);margin-bottom:6px;}
  h2{margin:0 0 10px;font-size:1.15rem;}

  /* Profile picker */
  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;}
  .profile-card{
    border-radius:20px;border:2px solid var(--border);background:var(--panel);
    padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
    cursor:pointer;font:inherit;font-weight:700;color:var(--text);
  }
  .profile-card .avatar{font-size:2.4rem;}
  .profile-card .bal{font-size:0.8rem;color:var(--text-dim);font-weight:600;}
  .profile-card.banker{border-color:var(--gold);background:var(--gold-light);}
  .profile-card.bankrupt{border-color:var(--red);}
  .profile-card.bankrupt .bal{color:var(--red);}
  .add-member-card{
    border-radius:20px;border:2px dashed var(--border);background:none;
    padding:20px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;color:var(--text-dim);font:inherit;font-weight:700;min-height:110px;
  }

  /* Pin pad */
  .pin-dots{display:flex;gap:12px;justify-content:center;margin:18px 0;}
  .pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);}
  .pin-dots span.filled{background:var(--green);border-color:var(--green);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
  .pin-pad button{
    padding:16px;font-size:1.2rem;border-radius:14px;border:1px solid var(--border);
    background:var(--panel);cursor:pointer;font-weight:700;
  }
  .pin-pad button:active{background:var(--green-light);}

  /* Balance / wallet */
  .balance-hero{
    background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;
    border-radius:20px;padding:22px;text-align:center;margin-bottom:18px;
  }
  .balance-hero .label{font-size:0.78rem;opacity:0.85;text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
  .balance-hero .amount{font-size:2.6rem;font-weight:800;margin:4px 0;}
  .balance-hero .bankrupt-tag{
    display:inline-block;background:var(--red);color:#fff;font-size:0.75rem;font-weight:700;
    padding:4px 10px;border-radius:999px;margin-top:6px;
  }



  /* Chore cards */
  .chore-card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:12px 14px;margin-bottom:10px;transition:transform .15s}
  .cc-ic{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none;background:var(--green-light)}
  .cc-body{flex:1;min-width:0}
  .cc-title{font-weight:800;font-size:1.02rem;line-height:1.25}
  .cc-sub{font-size:.8rem;color:var(--text-dim);margin-top:3px;font-weight:700}
  .cc-say{border:0;background:none;font-size:1rem;cursor:pointer;padding:0 2px;vertical-align:middle}
  .cc-btn{border:0;background:var(--green);color:#fff;font:inherit;font-weight:800;font-size:.9rem;padding:11px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:transform .12s}
  .cc-btn:active{transform:scale(.94)}
  .cc-btn.popped{background:#2fb892;animation:ccpop .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes ccpop{0%{transform:scale(.8)}100%{transform:scale(1)}}
  .cc-wait{font-size:.78rem;font-weight:800;color:var(--text-dim);text-align:center;max-width:110px;display:block}
  .chore-card.sent{opacity:.85}
  .chore-card.celebrate{transform:scale(1.02)}
  .coin-pop{position:fixed;z-index:60;pointer-events:none;font-size:22px;font-weight:800;color:#e0a800;animation:coinup 1.1s ease-out forwards}
  @keyframes coinup{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
  body[data-kid="anna"] .chore-card{border:0;border-radius:24px;box-shadow:0 6px 16px rgba(214,38,140,.18);padding:14px 16px}
  body[data-kid="anna"] .cc-ic{width:62px;height:62px;border-radius:50%;font-size:34px}
  body[data-kid="anna"] .chore-card:nth-child(4n+1) .cc-ic{background:#ffd3ea}
  body[data-kid="anna"] .chore-card:nth-child(4n+2) .cc-ic{background:#d7f7ec}
  body[data-kid="anna"] .chore-card:nth-child(4n+3) .cc-ic{background:#e6e0ff}
  body[data-kid="anna"] .chore-card:nth-child(4n+4) .cc-ic{background:#fff0c7}
  body[data-kid="anna"] .cc-title{font-size:1.15rem}
  body[data-kid="anna"] .cc-btn{background:#ff3d9e;font-size:1.02rem;padding:13px 20px;box-shadow:0 4px 10px rgba(255,61,158,.35)}
  body[data-kid="anna"] .cc-btn.popped{background:#2fb892;box-shadow:none}
  body[data-kid="ryan"] .chore-card{border:0;border-radius:0;background:#d4d0c8;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
  body[data-kid="ryan"] .cc-ic{border-radius:0;background:#fff;box-shadow:inset 1px 1px #808080,inset -1px -1px #dfdfdf;width:48px;height:48px;font-size:26px}
  body[data-kid="ryan"] .cc-title{font-family:"Courier New",monospace}
  body[data-kid="ryan"] .cc-btn{border-radius:0;background:#c0c0c0;color:#000;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;font-family:"Courier New",monospace}
  body[data-kid="ryan"] .cc-btn.popped{background:#c3e5c3}
  body[data-kid="ryan"] .cc-wait{font-family:"Courier New",monospace}
  /* Kid wallet: saving goal + Anna's coin jar + Ryan's bank terminal */
  .bump{display:inline-block;margin-top:6px;background:rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:.8rem;font-weight:800;animation:bump 1.2s ease}
  @keyframes bump{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .goal-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:14px 16px;margin-bottom:16px}
  .goal-title{font-weight:800;font-size:1.02rem}
  .goal-sub{font-size:.82rem;color:var(--text-dim);margin-top:6px;line-height:1.4}
  .goal-bar{height:16px;border-radius:8px;background:var(--green-light);margin-top:10px;overflow:hidden}
  .goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .6s}
  .goal-card.reached{border-color:var(--gold);background:var(--gold-light)}
  .goal-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .goal-card .pill-btn{margin-top:10px}.goal-actions .pill-btn{margin-top:0}
  .goal-star.on{background:var(--gold-light);border-color:var(--gold)}
  .wallet-anna,.wallet-ryan{position:relative;text-align:left;overflow:hidden;min-height:132px}
  .wallet-anna .jar{position:absolute;right:8px;bottom:4px;width:116px;height:116px}
  .wallet-ryan .spark{position:absolute;right:12px;bottom:10px;width:130px;height:58px}

  body[data-kid="anna"]{background:linear-gradient(160deg,#ffd0e8 0%,#ffb0da 45%,#efbfff 100%) fixed;--green:#e8269a;--green-dark:#c4177c;--green-light:#ffe3f1;--gold:#ff9a3d;--gold-dark:#b86100;--gold-light:#fff0d6;--cream:#ffe3f1;--border:#ffb8dc;--text:#3b2a5a;--text-dim:#8c7cb0}
  body[data-kid="anna"] header.app-header h1{font-family:"Trebuchet MS","Segoe UI",sans-serif;color:#ff1f8e}
  body[data-kid="anna"] .wallet-anna{background:linear-gradient(135deg,#ff3d9e,#b36bff);border-radius:28px;box-shadow:0 8px 20px rgba(214,38,140,.3)}
  body[data-kid="anna"] .wallet-anna .amount{font-size:3.3rem}
  body[data-kid="anna"] .card,body[data-kid="anna"] .goal-card,body[data-kid="anna"] .item-row{border:0;border-radius:22px;box-shadow:0 6px 16px rgba(214,38,140,.18)}
  body[data-kid="anna"] .goal-bar{background:#ffe3f1}
  body[data-kid="anna"] .goal-bar i{background:linear-gradient(90deg,#ff6b8b,#ffa95c,#ffd66b,#7dd8a0,#7cc4ff)}
  body[data-kid="anna"] .goal-title{font-size:1.15rem;color:#c4177c}
  body[data-kid="anna"] .tab-btn{border:0;box-shadow:0 3px 8px rgba(214,38,140,.22);font-size:.95rem}
  body[data-kid="anna"] .tab-btn.active{background:#ff3d9e}
  body[data-kid="anna"] .pill-btn{background:#ff3d9e;color:#fff}
  body[data-kid="anna"] .pill-btn.gold{background:#ff9a3d;color:#fff}
  body[data-kid="anna"] .pill-btn.outline{background:#fff;color:#8c7cb0;border:1px solid #ffb8dc}
  body[data-kid="anna"] .icon-btn{border-radius:999px;border:0;box-shadow:0 3px 8px rgba(214,38,140,.22)}

  body[data-kid="ryan"]{background:#008080 fixed;--green:#000080;--green-dark:#000080;--green-light:#dcdcdc;--gold:#c0c0c0;--gold-dark:#000;--gold-light:#ffffe1;--cream:#c0c0c0;--panel:#d4d0c8;--border:#7a7a7a;--text:#0a0a0a;--text-dim:#3d3d3d}
  body[data-kid="ryan"] .wrap{background:#c0c0c0;margin-top:14px;padding-top:6px;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;min-height:0}
  body[data-kid="ryan"] .r-bar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-family:"Courier New",monospace;font-size:.8rem;font-weight:700;padding:4px 8px;margin:0 -18px 12px;display:flex;justify-content:space-between}
  body[data-kid="ryan"] header.app-header h1{font-family:"Courier New",monospace;color:#000080;letter-spacing:.04em}
  body[data-kid="ryan"] .wallet-ryan{background:#0b1a0f;color:#4dff88;font-family:"Courier New",monospace;border-radius:0;box-shadow:inset 1px 1px #808080,inset -1px -1px #dfdfdf}
  body[data-kid="ryan"] .wallet-ryan .amount{font-size:3rem;text-shadow:0 0 8px rgba(77,255,136,.6)}
  body[data-kid="ryan"] .wallet-ryan .bump{background:rgba(77,255,136,.18)}
  body[data-kid="ryan"] .card,body[data-kid="ryan"] .goal-card,body[data-kid="ryan"] .item-row,body[data-kid="ryan"] .tab-btn,body[data-kid="ryan"] .pill-btn,body[data-kid="ryan"] .icon-btn{border:0;border-radius:0;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
  body[data-kid="ryan"] .tab-btn{background:#c0c0c0;color:#000}
  body[data-kid="ryan"] .tab-btn.active{background:#dcdcdc;box-shadow:inset 1px 1px #0a0a0a,inset -1px -1px #fff;color:#000}
  body[data-kid="ryan"] .pill-btn,body[data-kid="ryan"] .pill-btn.gold{background:#c0c0c0;color:#000}
  body[data-kid="ryan"] .goal-bar{border-radius:0;background:#fff;box-shadow:inset 1px 1px #808080}
  body[data-kid="ryan"] .goal-bar i{background:#000080}
  body[data-kid="ryan"] .goal-card.reached{background:#ffffe1}
  .tab-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
  .tab-btn{
    flex-shrink:0;padding:9px 16px;border-radius:999px;border:1px solid var(--border);
    background:var(--panel);font:inherit;font-size:0.85rem;font-weight:700;color:var(--text-dim);cursor:pointer;
  }
  .tab-btn.active{background:var(--green);border-color:var(--green);color:#fff;}

  .cat-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin:16px 0 8px;}
  /* Screen-time battery */
  .battery{display:flex;align-items:center;justify-content:center;margin:6px auto 8px}
  .bat-body{display:flex;gap:3px;padding:5px;border:3px solid #2f7d4f;border-radius:10px;background:#fff;width:200px;height:40px}
  .bat-body i{flex:1;border-radius:3px;background:rgba(0,0,0,.07)}
  .bat-tip{width:7px;height:16px;background:#2f7d4f;border-radius:0 4px 4px 0}
  .battery.full .bat-body i.on{background:#3cb371}
  .battery.mid .bat-body i.on{background:#f2b632}
  .battery.low .bat-body i.on{background:#e0452d}
  .battery.low,.battery.empty{animation:batPulse 1.4s ease-in-out infinite}
  .battery.low .bat-body,.battery.empty .bat-body{border-color:#e0452d}.battery.low .bat-tip,.battery.empty .bat-tip{background:#e0452d}
  @keyframes batPulse{50%{opacity:.6}}
  .bat-note{font-weight:800;font-size:.85rem;color:#b3321d;margin:4px 0}
  .bat-note[hidden]{display:none}
  .battery[data-bat-theme="anna"] .bat-body{border-color:#ff4fa8;border-radius:18px;box-shadow:0 3px 8px rgba(214,38,140,.25)}
  .battery[data-bat-theme="anna"] .bat-tip{background:#ff4fa8}
  .battery[data-bat-theme="anna"].full .bat-body i.on{background:linear-gradient(#ff8fc7,#ff4fa8)}
  .battery[data-bat-theme="anna"].mid .bat-body i.on{background:linear-gradient(#ffd27a,#ffa63d)}
  .battery[data-bat-theme="anna"] .bat-body i{border-radius:8px}
  .battery[data-bat-theme="ryan"] .bat-body{border-radius:0;border-color:#000;background:#000;box-shadow:inset 1px 1px #808080}
  .battery[data-bat-theme="ryan"] .bat-tip{background:#000;border-radius:0}
  .battery[data-bat-theme="ryan"] .bat-body i{border-radius:0;background:#222}
  .battery[data-bat-theme="ryan"].full .bat-body i.on{background:#00ff66}
  .battery[data-bat-theme="ryan"].mid .bat-body i.on{background:#ffd400}
  body[data-kid="anna"] .bat-note{color:#d6268c}
  body[data-kid="ryan"] .bat-note{font-family:"Courier New",monospace}
  /* Activity story + statement */
  .story-sum{background:var(--gold-light);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-weight:700;text-align:center}
  .story-row{display:flex;align-items:center;gap:10px;background:var(--card,#fff);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .story-row.pending{opacity:.8;border:2px dashed #ccc}
  .story-row.rejected{opacity:.6}
  .story-emoji{font-size:1.8rem;flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,.05)}
  .story-text{flex:1;font-size:.92rem;line-height:1.35}
  .story-amt{font-weight:800;color:var(--green-dark);flex:none}.story-amt.cost{color:var(--red)}
  body[data-kid="anna"] .story-sum{background:#fff3b8;border-radius:20px}
  body[data-kid="anna"] .story-row{border:0;border-radius:22px;box-shadow:0 6px 16px rgba(214,38,140,.15)}
  body[data-kid="anna"] .story-row.pending{border:2px dashed #ff9bd0}
  body[data-kid="anna"] .story-emoji{background:#ffe9f5}
  body[data-kid="anna"] .story-text{font-size:1rem}
  .stmt-head{background:#000080;color:#fff;font-family:"Courier New",monospace;font-weight:700;padding:4px 8px;letter-spacing:1px}
  .stmt-sum{display:flex;gap:6px;margin:6px 0;font-family:"Courier New",monospace;font-size:.72rem}
  .stmt-sum div{flex:1;background:#fff;padding:6px;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff}
  .stmt-sum b{display:block;font-size:1rem}
  .stmt{width:100%;border-collapse:collapse;background:#fff;font-family:"Courier New",monospace;font-size:.78rem;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff}
  .stmt th{background:#c0c0c0;text-align:left;padding:4px 6px;font-size:.7rem;border-bottom:1px solid #808080}
  .stmt td{padding:4px 6px;border-bottom:1px dotted #bbb;vertical-align:top}
  .stmt td.pos{color:#006400}.stmt td.neg{color:#b00020}
  .stmt tr.pending td,.stmt tr.rejected td{color:#777}
  .stmt tr.rejected td:nth-child(2){text-decoration:line-through}
  .stmt-st{font-size:.62rem;background:#ffd400;color:#000;padding:0 3px}.stmt-st.rejected{background:#b00020;color:#fff}
  /* Storefront shop */
  .storefront{border-radius:18px;overflow:hidden;margin-bottom:16px;background:var(--card,#fff);box-shadow:0 4px 12px rgba(0,0,0,.1);text-align:center}
  .storefront .awning{height:26px;background:repeating-linear-gradient(90deg,#e0562d 0 28px,#fff 28px 56px);border-bottom:4px solid rgba(0,0,0,.12);border-radius:0 0 14px 14px / 0 0 10px 10px}
  .storefront.closed .awning{filter:grayscale(.75) opacity(.8)}
  .sf-body{padding:10px 14px 14px}
  .sf-name{font-weight:800;font-size:1.05rem}
  .sf-sign{font-weight:800;margin-top:4px;color:var(--green-dark)}
  .storefront.closed .sf-sign{color:var(--gold-dark)}
  .sf-when{font-size:1.15rem;font-weight:800;margin-top:2px}
  .sf-hours{font-size:.74rem;color:var(--text-dim);margin-top:4px}
  .shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  @media(min-width:560px){.shop-grid{grid-template-columns:repeat(3,1fr)}}
  .shop-card{background:var(--card,#fff);border-radius:16px;padding:10px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:6px}
  .shop-card.owned{opacity:.75}
  .shop-pic{height:84px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.04);border-radius:12px}
  .shop-pet{width:96px;height:80px}
  .shop-emoji{font-size:2.6rem;line-height:1}
  .shop-title{font-weight:700;font-size:.85rem;min-height:2.2em;display:flex;align-items:center;justify-content:center}
  .shop-buy{width:100%}
  body[data-kid="anna"] .storefront .awning{background:repeating-linear-gradient(90deg,#ff4fa8 0 28px,#fff 28px 56px)}
  body[data-kid="anna"] .storefront,body[data-kid="anna"] .shop-card{border:0;border-radius:22px;box-shadow:0 6px 16px rgba(214,38,140,.18)}
  body[data-kid="anna"] .shop-pic{background:#ffe9f5;border-radius:16px}
  body[data-kid="ryan"] .storefront .awning{background:#000080;height:22px;border:0;border-radius:0}
  body[data-kid="ryan"] .storefront,body[data-kid="ryan"] .shop-card{border:0;border-radius:0;background:#c0c0c0;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
  body[data-kid="ryan"] .shop-pic{background:#fff;border-radius:0;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff}
  body[data-kid="ryan"] .sf-name,body[data-kid="ryan"] .shop-title{font-family:"Courier New",monospace}
  .item-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;
  }
  .item-row .title{font-weight:700;font-size:0.92rem;}
  .item-row .sub{font-size:0.76rem;color:var(--text-dim);margin-top:2px;}
  .item-row .price{font-weight:800;color:var(--green-dark);white-space:nowrap;}
  .item-row .price.cost{color:var(--gold-dark);}
  .pill-btn{
    flex-shrink:0;border:none;background:var(--green);color:#fff;font:inherit;font-weight:700;
    font-size:0.8rem;padding:8px 14px;border-radius:999px;cursor:pointer;
  }
  .pill-btn.gold{background:var(--gold);color:#3a2b05;}
  .pill-btn.outline{background:none;border:1px solid var(--border);color:var(--text);}
  .pill-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .pill-btn.small{padding:6px 10px;font-size:0.72rem;}
  .status-tag{

  (function(){ if(document.getElementById("shopSpriteHost")) return; const d = document.createElement("div"); d.id = "shopSpriteHost"; d.innerHTML = SHOP_SPRITE; document.body.appendChild(d); })();
  const ACC_EMOJI = {partyhat:"🎉", bow:"🎀", crown:"👑", shades:"😎"};
  const SHOP_CAT_EMOJI = {"Screen & Media":"📺", "Food & Treats":"🍦", "Privileges & Fun":"🎈", "Tangible Rewards":"🎁", "Pets & Accessories":"🐾"};
  const SHOP_WORDS = [[/ice cream|dessert|cookie|candy|treat|snack|pizza|soda/i,"🍦"],[/movie|show|tv|youtube/i,"🎬"],[/game|minecraft|roblox/i,"🎮"],[/stay up|bed ?time|late/i,"🌙"],[/toy|lego|book|craft/i,"🧸"],[/park|zoo|outing|trip|swim/i,"🌳"],[/friend|sleepover|playdate/i,"👯"],[/money|cash|\$/i,"💵"]];
  function shopEmoji(r){
    const g = r.grants || "";
    if(g.indexOf("acc:") === 0) return ACC_EMOJI[g.slice(4)] || "✨";
    for(const w of SHOP_WORDS) if(w[0].test(r.title)) return w[1];
    return SHOP_CAT_EMOJI[r.category] || "🎁";
  }
  function shopPicture(r){
    const g = r.grants || "";
    if(g.indexOf("pet:") === 0) return `<svg class="shop-pet" viewBox="0 0 230 190" aria-hidden="true"><use href="#pet-${g.slice(4)}"/></svg>`;
    return `<div class="shop-emoji" aria-hidden="true">${shopEmoji(r)}</div>`;
  }
  // "Opens in 2 hours" / "Closes in 40 minutes" so a closed store is a plan, not a dead end.
  function storeStatus(){
    const now = new Date();
    const win = d => { const day = d.getDay(); return day >= 1 && day <= 5 ? [15,17] : day === 6 ? [9,18] : [12,17]; };
    const at = (d, h) => { const x = new Date(d); x.setHours(Math.floor(h), Math.round((h % 1) * 60), 0, 0); return x; };
    const mins = ms => Math.max(1, Math.round(ms / 60000));
    const span = m => { if(m < 60) return m + (m === 1 ? " minute" : " minutes"); const h = Math.round(m / 60); return (m < 90 ? "about " : "about ") + h + (h === 1 ? " hour" : " hours"); };
    if(isStoreOpen()){ const w = win(now); return {open:true, text:"Closes in " + span(mins(at(now, w[1]) - now))}; }
    for(let i = 0; i < 8; i++){
      const d = new Date(now); d.setDate(d.getDate() + i);
      const w = win(d), start = at(d, w[0]);
      if(start > now){
        const clock = start.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}).replace(":00", "").toLowerCase();
        const text = i === 0 ? "Opens in " + span(mins(start - now)) : i === 1 ? "Opens tomorrow at " + clock : "Opens " + start.toLocaleDateString([], {weekday:"long"}) + " at " + clock;
        return {open:false, text};
      }
    }
    return {open:false, text:"Closed right now"};
  }

  // A short, unmissable tone at zero — not just a color change on a card
  // that might be off-screen. Built with Web Audio instead of an audio file
  // so there's nothing extra to host or load.
  function playTimesUpTone(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      let t = ctx.currentTime;
      for(let i = 0; i < 3; i++){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.4);
        t += 0.45;
      }
    }catch(e){}
  }

  // Shared between the kid's own home and the Banker's Household tab, so
  // both ever show the exact same countdown — the whole point being that
  // the Banker can check remaining time without having to ask the kid.
  // Once it hits zero the session doesn't auto-end: it flips to "overtime"
  // and keeps counting UP in red, because anything played past zero is what
  // gets deducted from tomorrow's balance — the cost only exists if someone
  // actually has to stop it.
  // The battery: 10 segments that drain as the minutes go. Same picture for
  // the kid and the Banker; it just makes "how much is left" visible without
  // reading numbers. Level classes: full / mid / low (<=5 min) / empty.
  function batteryHtml(pct, theme, label){
    const on = Math.ceil(Math.max(0, Math.min(100, pct)) / 10);
    const lvl = pct <= 0 ? "empty" : pct <= 20 ? "low" : pct <= 50 ? "mid" : "full";
    let segs = "";
    for(let i = 0; i < 10; i++) segs += `<i class="${i < on ? "on" : ""}"></i>`;
    return `<div class="battery ${lvl}" data-bat-theme="${theme}" role="img" aria-label="${label}">
      <div class="bat-body">${segs}</div><div class="bat-tip"></div>
    </div>`;
  }
  function screenTimeCard(m, isBanker){
    const session = activeSessionFor(m.id);
    const theme = isBanker ? "plain" : kidTheme(m);
    if(session){
      const isOvertime = session.status === "overtime";
      const total = Math.max(1, Number(session.minutes) || 1) * 60000;
      const pct = Math.max(0, Math.min(100, (new Date(session.ends_at).getTime() - Date.now()) / total * 100));
      const sparkle = theme === "anna" ? "✨ Sparkle power" : theme === "ryan" ? "BATTERY" : "Screen time running";
      return `<div class="card screen-card" style="text-align:center;${isOvertime ? "border-color:var(--red);background:var(--red-light);" : ""}">
        <div class="kicker" style="${isOvertime ? "color:var(--red);" : ""}">${isOvertime ? "⏰ Time's up — playing overtime" : sparkle}</div>
        ${batteryHtml(pct, theme, "Screen time battery")}
        <div style="font-size:3.2rem;line-height:1.1;font-weight:800;${isOvertime ? "color:var(--red);" : "color:var(--green-dark);"}" data-countdown="${session.ends_at}" data-total="${total}" data-session-id="${session.id}" data-session-status="${session.status}" data-member-id="${session.member_id}">--:--</div>
        <div class="bat-note" hidden>${theme === "anna" ? "🌈 Almost out of sparkle! Find a good stopping place." : theme === "ryan" ? "LOW BATTERY: 5 MIN. SAVE YOUR WORLD." : "5 minutes left — find a stopping place."}</div>
        ${isOvertime ? `<div style="font-size:0.8rem;color:var(--red);margin:2px 0 8px;">Comes out of tomorrow's balance</div>` : ""}
        <button class="pill-btn ${isOvertime ? "" : "outline"} small" data-end-session="${session.id}" style="margin-top:8px;">${isOvertime ? "Stop now" : "Stop early"}</button>
      </div>`;
    }
    if((m.screen_minutes_balance || 0) > 0){
      return `<div class="card screen-card" style="text-align:center;">
        <div class="kicker">${theme === "anna" ? "🔋 Screen time, fully charged" : "Screen time banked"}</div>
        ${batteryHtml(100, theme, "Screen time battery, full")}
        <div style="font-size:1.6rem;font-weight:800;">${m.screen_minutes_balance} min</div>
        ${isBanker
          ? `<div style="font-size:0.8rem;color:var(--text-dim);">Not started yet</div>`
          : `<button class="pill-btn" data-start-session="${m.id}" style="margin-top:8px;">▶ Start screen time</button>`}
      </div>`;
    }
    return "";
  }

  // ===========================================================================
  // Mutations
  // ===========================================================================
  // opts.quiet = caller handles the toast/refresh itself (Quick Fine does
  // several in a row and shows one combined message). Returns the member's
  // before/after rows on success so a caller can offer an exact undo.
  async function approveTransaction(txn, opts){
    const quiet = !!(opts && opts.quiet);
    return once("approve:" + txn.id, async () => {
      const m = member(txn.member_id);
      if(!m) return null;
      const amount = Number(txn.amount);
      const fresh = await supa.from("members").select("current_balance").eq("id", m.id).maybeSingle();
      // A purchase has to be covered by the balance. A fine can overdraw
      // (that's what bankruptcy is for), but approving a purchase the kid
      // can't afford used to floor them at $0 and hand over the item free.
      if(txn.type === "spend" && fresh.data && Number(fresh.data.current_balance) + amount < 0){
        showToast(`Can't approve — ${m.name} only has ${fmt(fresh.data.current_balance)}`);
        return null;
      }
      // Claim the request first. If someone else (or a second tap) already
      // approved or declined it, this matches nothing and we stop — that is
      // what stops one request from paying out twice.
      const { data: claimed } = await supa.from("transactions")
        .update({ status: "approved", resolved_at: new Date().toISOString() })
        .eq("id", txn.id).eq("status", "pending").select();
      if(!claimed || !claimed.length){
        if(!quiet){ showToast("Already handled"); reload(); }
        return null;
      }
      // Approving a screen-time purchase banks the minutes rather than
      // starting them immediately — the kid (or Banker) starts the actual
      // countdown separately, whenever they're really about to use it.
      const result = await adjustMember(m.id, cur => {
        let bal = round2(Number(cur.current_balance) + amount);
        let bankrupt = cur.bankrupt;
        if(bal <= 0 && amount < 0){ bal = 0; bankrupt = true; }
        if(bal > 0 && amount > 0) bankrupt = false;
        const next = { current_balance: bal, bankrupt };
        if(txn.screen_minutes) next.screen_minutes_balance = (cur.screen_minutes_balance || 0) + txn.screen_minutes;
        return next;
      });
      if(!result){
        await supa.from("transactions").update({ status: "pending", resolved_at: null }).eq("id", txn.id);
        if(!quiet){ showToast("Couldn't update the balance — try again"); reload(); }
        return null;
      }
      if(txn.chore_log_id){
        await supa.from("chore_logs").update({ status: "approved", approved_at: new Date().toISOString() }).eq("id", txn.chore_log_id);
      }
      if(!quiet){
        showToast(`Approved — ${m.name}'s new balance ${fmt(result.after.current_balance)}`);
        reload();
      }
      return { before: result.before, after: result.after };
    });
  }

  async function rejectTransaction(txn){
    return once("reject:" + txn.id, async () => {
      const { data: claimed } = await supa.from("transactions")
        .update({ status: "rejected", resolved_at: new Date().toISOString() })
        .eq("id", txn.id).eq("status", "pending").select();
      if(claimed && claimed.length && txn.chore_log_id){
        await supa.from("chore_logs").update({ status: "rejected" }).eq("id", txn.chore_log_id);
      }
      showToast(claimed && claimed.length ? "Request declined" : "Already handled");
      reload();
    });
  }

  // A kid can't have two identical requests waiting at once. That is both
  // the double-tap guard and sensible on its own: the same chore can't be
  // earned twice before the first one has even been looked at.
  async function hasPendingRequest(memberId, description){
    const { data } = await supa.from("transactions").select("id")
      .eq("member_id", memberId).eq("description", description).eq("status", "pending").limit(1);
    return !!(data && data.length);
  }

  async function submitChore(chore, memberId){
    return once("submit:" + memberId + ":" + chore.id, async () => {
      if(await hasPendingRequest(memberId, chore.title)){
        showToast(`"${chore.title}" is already waiting on the Banker`);
        return;
      }
      await supa.from("transactions").insert({
        household_id: userId, member_id: memberId, type: "earn",
        amount: chore.default_payout, description: chore.title, status: "pending"
      });
      showToast(`Submitted "${chore.title}" for approval`);
      reload();
    });
  }

  // What a kid can still spend: balance minus everything they've already
  // asked for that is waiting on approval. Without subtracting the pending
  // requests, a kid with $5 could stack five $5 requests.
  function spendableFor(m){
    const pendingSpend = state.txns
      .filter(t => t.member_id === m.id && t.status === "pending" && t.type === "spend")
      .reduce((sum, t) => sum + Math.abs(Number(t.amount)), 0);
    return round2(Number(m.current_balance) - pendingSpend);
  }

  async function requestReward(item, memberId){
    return once("reward:" + memberId + ":" + item.id, async () => {
      const m = member(memberId);
      if(m && (m.bankrupt || spendableFor(m) < Number(item.cost))){
        showToast("Not enough in the balance for that yet");
        return;
      }
      if(await hasPendingRequest(memberId, item.title)){
        showToast(`"${item.title}" is already waiting on the Banker`);
        return;
      }
      await supa.from("transactions").insert({
        household_id: userId, member_id: memberId, type: "spend",
        amount: -Math.abs(item.cost), description: item.title, status: "pending", reward_item_id: item.id
      });
      showToast(`Requested "${item.title}" — waiting on the Banker`);
      reload();
    });
  }

  function screenTimeCost(minutes){
    const rate = Number(state.household.screen_time_rate) || 5; // minutes per $1
    return Math.round((minutes / rate) * 100) / 100;
  }

  async function requestScreenTime(minutes, memberId){
    return once("screen:" + memberId, async () => {
      const m = member(memberId);
      const cost = screenTimeCost(minutes);
      if(m && (m.bankrupt || spendableFor(m) < cost)){
        showToast(`Not enough — ${minutes} min costs ${fmt(cost)}`);
        return;
      }
      const hasPendingScreen = state.txns.some(t => t.member_id === memberId && t.status === "pending" && t.screen_minutes);
      if(hasPendingScreen){
        showToast("You already have a screen time request waiting");
        return;
      }
      await supa.from("transactions").insert({
        household_id: userId, member_id: memberId, type: "spend",
        amount: -cost, description: `${minutes} min screen time`, status: "pending", screen_minutes: minutes
      });
      showToast(`Requested ${minutes} min screen time — waiting on the Banker`);
      reload();
    });
  }

  // Cashes in a kid's entire banked (paid-for, not-yet-used) screen time
  // into one running countdown. Storing ends_at server-side (not just
  // ticking a local timer) is what lets the Banker's screen and the kid's
  // screen show the exact same time remaining without either device being
  // the "source of truth" — and it's what stops a kid from just closing
  // the tab to make more time appear later.
  async function startScreenSession(memberId){
    return once("start:" + memberId, async () => {
      // Only one running session per kid, checked against the server (not
      // the in-memory copy) so a second device can't start a parallel one.
      const { data: running } = await supa.from("screen_sessions").select("id")
        .eq("member_id", memberId).in("status", ["active", "overtime"]).limit(1);
      if(running && running.length){ showToast("Screen time is already running"); reload(); return; }
      // Zero the bank first and use what was actually in it. Whoever gets
      // here first takes the minutes; a double-tap finds an empty bank.
      const taken = await adjustMember(memberId, cur =>
        (cur.screen_minutes_balance || 0) > 0 ? { screen_minutes_balance: 0 } : null);
      const minutes = taken && !taken.unchanged ? (taken.before.screen_minutes_balance || 0) : 0;
      if(minutes <= 0){ reload(); return; }
      const startedAt = new Date();
      const endsAt = new Date(startedAt.getTime() + minutes * 60000);
      const { error } = await supa.from("screen_sessions").insert({
        household_id: userId, member_id: memberId, minutes,
        started_at: startedAt.toISOString(), ends_at: endsAt.toISOString(), status: "active"
      });
      if(error){
        await adjustMember(memberId, cur => ({ screen_minutes_balance: (cur.screen_minutes_balance || 0) + minutes }));
        showToast("Couldn't start — your minutes are safe, try again");
        reload();
        return;
      }
      showToast(`Screen time started — ${minutes} min`);
      reload();
    });
  }

  // Ends a session. Three situations:
  //  - stopped early: whatever was left goes back in the kid's bank, so
  //    stopping to eat dinner or an idle timeout never costs paid-for time
  //  - ran out and kept going (overtime): the extra minutes are costed at the
  //    household rate and charged against tomorrow, not today
  //  - endedAtMs lets the idle auto-stop count time up to the last touch
  //    instead of up to whenever the check finally noticed
  async function finishScreenSession(sessionId, opts){
    return once("finish:" + sessionId, async () => {
      const endedAt = (opts && opts.endedAtMs) || Date.now();
      // Claim the session so two taps or two devices can't both settle it
      // (which is how a single overtime used to be charged twice).
      const { data: claimed } = await supa.from("screen_sessions")
        .update({ status: "completed" }).eq("id", sessionId).in("status", ["active", "overtime"]).select();
      if(!claimed || !claimed.length){ reload(); return; }
      const session = claimed[0];
      const endsAtMs = new Date(session.ends_at).getTime();
      if(endedAt < endsAtMs){
        const unused = Math.floor((endsAtMs - endedAt) / 60000);
        if(unused > 0){
          await adjustMember(session.member_id, cur => ({ screen_minutes_balance: (cur.screen_minutes_balance || 0) + unused }));
          showToast(`Stopped — ${unused} min put back in the bank`);
        } else {
          showToast("Screen time ended");
        }
      } else {
        const overtimeMinutes = Math.ceil((endedAt - endsAtMs) / 60000);
        if(overtimeMinutes > 0){
          await chargeOvertimeTomorrow(session.member_id, overtimeMinutes);
          showToast(`Ended — ${overtimeMinutes} min overtime comes off tomorrow's balance`);
        } else {
          showToast("Screen time ended");
        }
      }
      reload();
    });
  }

  async function chargeOvertimeTomorrow(memberId, minutes){
    const rate = Number(state.household.screen_time_rate) || 5; // minutes per $1
    const cost = round2(minutes / rate);
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    // adjustMember (not a blind overwrite) so two overtimes ending close
    // together add up instead of one erasing the other.
    await adjustMember(memberId, cur => ({
      pending_overtime_charge: round2(Number(cur.pending_overtime_charge || 0) + cost),
      pending_overtime_charge_date: localISO(tomorrow)
    }));
  }

  // Runs on every reload — including from whatever other device/tab is also
  // polling (see startAutoRefresh), so two devices can genuinely race to
  // apply the same charge at nearly the same moment. The update below is an
  // optimistic-lock claim: it only clears pending_overtime_charge if it
  // still equals the exact amount we read, so whichever caller's write
  // lands first "wins" the charge, and the loser's update matches zero rows
  // and skips inserting a fine — instead of both of them charging it.
  async function applyDueOvertimeCharges(members){
    const today = localISO(new Date());
    const due = members.filter(m =>
      Number(m.pending_overtime_charge) > 0 && m.pending_overtime_charge_date && m.pending_overtime_charge_date <= today
    );
    for(const m of due){
      const cost = Number(m.pending_overtime_charge);
      const { data: claimed } = await supa.from("members")
        .update({ pending_overtime_charge: 0, pending_overtime_charge_date: null })
        .eq("id", m.id)
        .eq("pending_overtime_charge", cost)
        .select();
      if(!claimed || !claimed.length) continue; // another device already claimed this charge
      await supa.from("transactions").insert({
        household_id: userId, member_id: m.id, type: "fine",
        amount: -cost, description: "Overtime screen time (yesterday)",
        status: "approved", resolved_at: new Date().toISOString()
      });
      const result = await adjustMember(m.id, cur => {
        const bal = Math.max(0, round2(Number(cur.current_balance) - cost));
        return { current_balance: bal, bankrupt: bal <= 0 };
      });
      if(result){
        m.current_balance = result.after.current_balance;
        m.bankrupt = result.after.bankrupt;
      }
      m.pending_overtime_charge = 0;
      m.pending_overtime_charge_date = null;
    }
  }

  async function setScreenTimeRate(rate){
    await supa.from("households").update({ screen_time_rate: rate }).eq("id", userId);
    showToast("Screen time rate updated");
    reload();
  }

  // Inserts a transaction, recording which parent issued it when the
  // issued_by column exists. If the column hasn't been added to the database
  // yet, retry without it so fining never breaks over a missing migration.
  async function insertTxn(row){
    let res = await supa.from("transactions").insert(row).select().single();
    if(res.error && "issued_by" in row && /issued_by/i.test(res.error.message || "")){
      const rest = Object.assign({}, row);
      delete rest.issued_by;
      res = await supa.from("transactions").insert(rest).select().single();
    }
    return res;
  }

  async function issueFine(fine, memberId, customTitle, customAmount){
    const amount = -Math.abs(customAmount != null ? customAmount : fine.amount);
    const title = customTitle || fine.title;
    const { data } = await insertTxn({
      household_id: userId, member_id: memberId, type: "fine",
      amount, description: title, status: "pending", issued_by: state.activeMemberId
    });
    if(data) await approveTransaction(data);
  }

  // ---------------------------------------------------------------- Quick
  // One tap from a parent: fine or award one or more kids right now, no
  // approval queue (the parent IS the approval). Each one is applied through
  // the same approve path as everything else, so balances, bankruptcy and
  // the double-tap guards all behave identically.
  async function quickIssue(kind, label, amount, kidIds){
    if(!kidIds.length){ showToast("Tap who it's for first"); return; }
    return once("quick:" + kind + ":" + label + ":" + kidIds.join(","), async () => {
      const done = [];
      for(const kidId of kidIds){
        const signed = kind === "fine" ? -Math.abs(amount) : Math.abs(amount);
        const { data } = await insertTxn({
          household_id: userId, member_id: kidId, type: kind === "fine" ? "fine" : "earn",
          amount: signed, description: label, status: "pending", issued_by: state.activeMemberId
        });
        if(!data) continue;
        const info = await approveTransaction(data, { quiet: true });
        if(info) done.push({ txnId: data.id, kidId, before: info.before, after: info.after });
      }
      await reload();
      if(!done.length){ showToast("Couldn't save that — try again"); return; }
      const names = done.map(d => (member(d.kidId) || {}).name).filter(Boolean).join(" & ");
      const verb = kind === "fine" ? `Fined ${names} ${fmt(Math.abs(amount))}` : `Gave ${names} ${fmt(Math.abs(amount))}`;
      showUndoBar(`${verb} — ${label}`, () => undoQuick(done));
    });
  }

  // Undo only restores the exact balance from before, and only if nothing
  // else has touched that kid since — otherwise it would overwrite someone
  // else's change, so it refuses and says so.
  async function undoQuick(done){
    let failed = 0;
    for(const d of done){
      const { data: claimed } = await supa.from("transactions")
        .update({ status: "rejected", resolved_at: new Date().toISOString() })
        .eq("id", d.txnId).eq("status", "approved").select();
      if(!claimed || !claimed.length){ failed++; continue; }
      const restored = await adjustMember(d.kidId, cur =>
        Number(cur.current_balance) === Number(d.after.current_balance)
          ? { current_balance: d.before.current_balance, bankrupt: d.before.bankrupt } : null);
      if(!restored || restored.unchanged){
        await supa.from("transactions").update({ status: "approved" }).eq("id", d.txnId);
        failed++;
      }
    }
    showToast(failed ? "Couldn't undo — their balance changed since" : "Undone");
    reload();
  }

  let undoTimer = null;
  function showUndoBar(text, onUndo){
    let bar = document.getElementById("undoBar");
    if(!bar){
      bar = document.createElement("div");
      bar.id = "undoBar";
      bar.className = "undo-bar";
      document.body.appendChild(bar);
    }
    bar.innerHTML = `<span></span><button type="button">Undo</button>`;
    bar.firstChild.textContent = text;
    bar.classList.add("show");
    clearTimeout(undoTimer);
    const hide = () => bar.classList.remove("show");
    bar.querySelector("button").onclick = () => { hide(); clearTimeout(undoTimer); onUndo(); };
    undoTimer = setTimeout(hide, 9000);
  }

  // ------------------------------------------------- "You were fined" notice
  // A fine that the kid never sees teaches nothing, and a parent who sees no
  // reaction stops bothering. When a kid opens their own profile on a device,
  // anything a parent fined or awarded since they last looked is shown full
  // screen once. Tracked per device, and the first visit on a device doesn't
  // replay history.
  function maybeShowKidNotice(m){
    if(document.getElementById("kidNotice")) return;
    const key = "mm_notice_ack_" + m.id;
    let ack = 0;
    try{ ack = Number(localStorage.getItem(key)) || 0; }catch(e){}
    if(!ack){
      try{ localStorage.setItem(key, String(Date.now())); }catch(e){}
      return;
    }
    const fresh = state.txns.filter(t =>
      t.member_id === m.id && t.status === "approved" && t.resolved_at &&
      (t.type === "fine" || (t.type === "earn" && t.issued_by)) &&
      new Date(t.resolved_at).getTime() > ack
    ).sort((a, b) => new Date(a.resolved_at) - new Date(b.resolved_at));
    if(!fresh.length) return;
    const hasFine = fresh.some(t => t.type === "fine");
    const rows = fresh.map(t => {
      const by = t.issued_by && member(t.issued_by) ? ` · from ${escapeHtml(member(t.issued_by).name)}` : "";
      return `<div class="notice-row"><span>${escapeHtml(t.description)}${by}</span><b>${t.amount < 0 ? "−" : "+"}${fmt(Math.abs(t.amount))}</b></div>`;
    }).join("");
    const overlay = document.createElement("div");
    overlay.id = "kidNotice";
    overlay.className = "notice-overlay " + (hasFine ? "bad" : "good");
    overlay.innerHTML = `<div class="notice-card">
      <div class="notice-emoji">${hasFine ? "⚠️" : "🌟"}</div>
      <h2>${hasFine ? "Heads up" : "Nice work!"}</h2>
      ${rows}
      <div class="notice-bal">Your balance: ${fmt(m.current_balance)}</div>
      <button class="primary-btn" type="button">OK</button>
    </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector("button").addEventListener("click", () => {
      const newest = Math.max.apply(null, fresh.map(t => new Date(t.resolved_at).getTime()));
      try{ localStorage.setItem(key, String(newest)); }catch(e){}
      overlay.remove();
    });
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = hasFine ? "square" : "sine";
      osc.frequency.value = hasFine ? 220 : 660;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.55);
    }catch(e){}
  }

  async function assignChore(chore, memberId){
    let { data: rule } = await supa.from("assignment_rules").insert({
      household_id: userId, chore_id: chore.id, assigned_member_id: memberId,
      frequency_type: "interval", interval_days: 0
    }).select().single();
    await supa.from("chore_logs").insert({
      household_id: userId, assignment_rule_id: rule.id, assigned_member_id: memberId,
      due_date: new Date().toISOString().slice(0,10), status: "pending"
    });
    showToast(`Assigned "${chore.title}"`);
    reload();
  }

  async function markChoreDone(log){
    return once("done:" + log.id, async () => {
      // Claim the chore log first (pending -> submitted) so a double-tap
      // can only ever create one payout request for it.
      const { data: claimed } = await supa.from("chore_logs")
        .update({ status: "submitted", submitted_at: new Date().toISOString() })

  // Ticks any visible screen-time countdown once a second by writing
  // straight to the DOM, instead of re-running the full render() loop —
  // a full re-render every second would fight the user for scroll
  // position and cursor focus. Reads ends_at (set server-side when the
  // session started) off each element's own dataset, so it's always
  // computing "how long is actually left" fresh rather than trusting a
  // number that could drift.
  // There's no realtime subscription — a screen left open (say, the
  // Banker's tablet sitting on the counter) never hears about a chore
  // submission or screen-time request that happens on someone else's
  // device. Tab switches and button clicks only re-fetch as a side effect
  // of a mutation, not on their own. This polls quietly in the background
  // so "the kid just asked" actually shows up without anyone having to
  // manually reload the page — but skips a beat while a sheet is open or
  // someone's mid-typing, so it never yanks focus out from under them.
  let autoRefreshInterval = null;
  function startAutoRefresh(){
    clearInterval(autoRefreshInterval);
    autoRefreshInterval = setInterval(() => {
      const active = document.activeElement;
      const typing = active && ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName);
      const sheetOpen = document.querySelector(".overlay.open");
      if(!typing && !sheetOpen && !document.hidden) reload(true);
    }, 15000);
    // Coming back to the app (unlocking the phone, switching tabs) should
    // show current data right away, not up to 15 seconds later.
    if(!startAutoRefresh.wired){
      startAutoRefresh.wired = true;
      document.addEventListener("visibilitychange", () => {
        if(!document.hidden && userId && state.view !== "login") reload(true);
      });
    }
  }

  // "Ryan left his timer running" safeguard: if the device showing his own
  // running countdown gets no touch/click/key/scroll for 10 minutes, we
  // treat that as him having walked away (or fallen asleep) and stop the
  // session right there — capping how much overtime can ever pile up
  // unattended instead of letting it run indefinitely until someone
  // happens to open the app again. Only fires on the kid's OWN home screen
  // (state.activeMemberId matches the session's member) so a Banker's
  // tablet sitting idle on the Household tab never stops a kid's session
  // that's actually still running fine on his own device.
  const IDLE_TIMEOUT_MS = 10 * 60 * 1000;
  let lastActivityAt = Date.now();
  ["mousemove", "mousedown", "keydown", "touchstart", "scroll"].forEach(evt => {
    document.addEventListener(evt, () => { lastActivityAt = Date.now(); }, { passive: true });
  });

  // Drain the battery picture to match the countdown; the "5 minutes left" note shows once, gently.
  function updateBattery(el, remainingMs){
    const card = el.closest(".screen-card");
    const bat = card && card.querySelector(".battery");
    if(!bat) return;
    const total = Number(el.dataset.total) || 1;
    const pct = Math.max(0, Math.min(100, remainingMs / total * 100));
    const on = Math.ceil(pct / 10);
    bat.querySelectorAll("i").forEach((seg, i) => seg.classList.toggle("on", i < on));
    bat.className = "battery " + (pct <= 0 ? "empty" : (remainingMs <= 5 * 60000 || pct <= 20) ? "low" : pct <= 50 ? "mid" : "full");
    const note = card.querySelector(".bat-note");
    if(note) note.hidden = !(remainingMs > 0 && remainingMs <= 5 * 60000);
  }

  let countdownInterval = null;
  function startCountdownTicker(){
    clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      document.querySelectorAll("[data-countdown]").forEach(el => {
        const endsAt = new Date(el.dataset.countdown).getTime();
        const remainingMs = endsAt - Date.now();
        const isOwnScreen = state.activeMemberId === el.dataset.memberId;
        if(isOwnScreen && !el.dataset.idleStopFired && (Date.now() - lastActivityAt) > IDLE_TIMEOUT_MS){
          el.dataset.idleStopFired = "1";
          // Count time only up to the last touch, and (if it was still
          // within the paid-for time) the unused minutes go back in the bank.
          finishScreenSession(el.dataset.sessionId, { endedAtMs: lastActivityAt });
          return;
        }
        if(remainingMs <= 0){
          // Past zero: keep counting UP instead of stopping, since the whole
          // point is that overtime is visible and has a real cost, not a
          // dead "Time's up!" label the kid can ignore.
          const overtimeSec = Math.floor(-remainingMs / 1000);
          const mm = Math.floor(overtimeSec / 60);
          const ss = overtimeSec % 60;
          el.textContent = `+${mm}:${String(ss).padStart(2, "0")}`;
          updateBattery(el, 0);
          if(!el.dataset.overtimeFired){
            el.dataset.overtimeFired = "1";
            if(el.dataset.sessionStatus === "active"){
              playTimesUpTone();
              const sess = state.sessions.find(s => s.id === el.dataset.sessionId);
              if(sess) sess.status = "overtime";
              supa.from("screen_sessions").update({ status: "overtime" }).eq("id", el.dataset.sessionId);
              // Re-render now so the card switches to its red overtime look
              // (border, "Comes out of tomorrow's balance") without waiting
              // for the next unrelated navigation.
              render();
            }
          }
        } else {
          updateBattery(el, remainingMs);
          const totalSec = Math.ceil(remainingMs / 1000);
          const mm = Math.floor(totalSec / 60);
          const ss = totalSec % 60;
          el.textContent = `${mm}:${String(ss).padStart(2, "0")}`;
        }
      });
    }, 1000);
  }

  function coinJarSvg(balance){

    const n = Math.max(0, Math.min(spots.length, Math.round(Number(balance) || 0)));

  // A tiny line of the balance over the last few approved moves (Ryan's terminal).
  function sparkline(m){
    const mine = state.txns.filter(t => t.member_id === m.id && t.status === "approved").sort((a,b) => String(b.created_at||"").localeCompare(String(a.created_at||""))).slice(0, 8);

    const pts = [bal];
    mine.forEach(t => { bal = round2(bal - Number(t.amount)); pts.unshift(bal); });
    if(pts.length < 2) return "";
    const lo = Math.min(...pts), hi = Math.max(...pts), span = Math.max(0.01, hi - lo);
    const d = pts.map((v,i) => `${i ? "L" : "M"}${(6 + i * (108 / (pts.length - 1))).toFixed(1)} ${(46 - ((v - lo) / span) * 38).toFixed(1)}`).join(" ");
    return `<svg class="spark" viewBox="0 0 120 54" aria-hidden="true"><path d="${d}" fill="none" stroke="#4dff88" stroke-width="3" stroke-linejoin="round"/></svg>`;

  function choreEmoji(chore){
    const t = chore ? String(chore.title || "") : "";
    for(const [re, e] of CHORE_EMOJI) if(re.test(t)) return e;
    return (chore && CHORE_CAT_EMOJI[chore.category]) || "⭐";
  }
  // Activity: Anna reads it as a story ("You did the dishes and earned $1!"),
  // Ryan reads it as a bank statement with a running balance. Same data.
  function activityKind(t){
    const d = String(t.description || "");
    if(t.screen_minutes || /screen time/i.test(d)) return "screen";
    if(t.type === "earn") return "earn";
    if(t.type === "fine") return "fine";
    if(t.type === "spend") return /^(Pet|Accessory):/i.test(d) ? "pet" : "spend";
    return "adjust";
  }
  function dayLabel(iso){
    const d = new Date(iso), today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((today - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    if(diff === 0) return "Today";
    if(diff === 1) return "Yesterday";
    if(diff < 7) return d.toLocaleDateString([], {weekday:"long"});
    return d.toLocaleDateString([], {month:"short", day:"numeric"});
  }
  function storyLine(t){
    const d = escapeHtml(t.description || ""), amt = fmt(Math.abs(t.amount));
    const k = activityKind(t);
    const pend = t.status === "pending", rej = t.status === "rejected";
    if(k === "earn"){
      const e = choreEmoji({title: t.description});
      return {emoji: e, text: rej ? `You sent <b>${d}</b>. Mom said not this time.` : pend ? `You finished <b>${d}</b>! Mom will check it and you'll get ${amt}.` : `You did <b>${d}</b> and earned <b>${amt}</b>!`};
    }
    if(k === "pet"){
      const n = d.replace(/^(Pet|Accessory):\s*/i, "");
      return {emoji: "🐾", text: rej ? `Mom said not yet for <b>${n}</b>.` : pend ? `You asked for <b>${n}</b>! Waiting for Mom.` : `You got <b>${n}</b>! Go say hi on your school page.`};
    }
    if(k === "screen"){
      return {emoji: "🔋", text: rej ? `Mom said not this time for ${d}.` : pend ? `You asked for <b>${d}</b>. Waiting for Mom.` : `You bought <b>${d}</b>.`};
    }
    if(k === "fine"){
      return {emoji: "🌧️", text: rej ? `A reminder about <b>${d}</b> was cancelled.` : `A reminder: <b>${d}</b>. That's ${amt} back to the bank. Tomorrow's a fresh start!`};
    }
    if(k === "spend"){
      return {emoji: "🛍️", text: rej ? `Mom said not this time for <b>${d}</b>.` : pend ? `You asked for <b>${d}</b>. Waiting for Mom.` : `You got <b>${d}</b> for ${amt}!`};
    }
    return {emoji: "✨", text: `<b>${d}</b> (${t.amount < 0 ? "-" : "+"}${amt})`};
  }
  function activityView(m, theme){
    const mine = state.txns.filter(t => t.member_id === m.id);
    if(!mine.length) return `<div class="empty-note">${theme === "anna" ? "Your story starts with your first chore! 🌈" : "No transactions yet."}</div>`;
    const approved = mine.filter(t => t.status === "approved");
    const weekAgo = Date.now() - 7 * 86400000;
    const earned = approved.filter(t => t.amount > 0 && new Date(t.created_at).getTime() >= weekAgo).reduce((n, t) => n + Number(t.amount), 0);
    const spent = approved.filter(t => t.amount < 0 && new Date(t.created_at).getTime() >= weekAgo).reduce((n, t) => n - Number(t.amount), 0);
    const shown = mine.slice(0, 30);
    if(theme === "ryan"){
      // Running balance: walk back from today's balance through approved rows.
      let bal = Number(m.current_balance) || 0;
      const rows = shown.map(t => {
        const after = t.status === "approved" ? bal : null;
        if(t.status === "approved") bal -= Number(t.amount);
        return {t, after};
      });
      let h = `<div class="stmt-head">ACCOUNT STATEMENT</div>
        <div class="stmt-sum"><div>IN (7d)<b>+${fmt(earned)}</b></div><div>OUT (7d)<b>-${fmt(spent)}</b></div><div>BALANCE<b>${fmt(m.current_balance)}</b></div></div>
        <table class="stmt"><thead><tr><th>DATE</th><th>DESCRIPTION</th><th>AMT</th><th>BAL</th></tr></thead><tbody>`;
      rows.forEach(({t, after}) => {
        const st = t.status === "approved" ? "" : `<span class="stmt-st ${t.status}">${t.status === "pending" ? "PENDING" : "DENIED"}</span>`;
        h += `<tr class="${t.status}"><td>${new Date(t.created_at).toLocaleDateString([], {month:"2-digit", day:"2-digit"})}</td><td>${escapeHtml(t.description)} ${st}</td><td class="${t.amount < 0 ? "neg" : "pos"}">${t.amount < 0 ? "-" : "+"}${fmt(Math.abs(t.amount))}</td><td>${after == null ? "--" : fmt(after)}</td></tr>`;
      });
      return h + `</tbody></table>`;
    }
    let h = theme === "anna" ? `<div class="story-sum">⭐ This week you earned <b>${fmt(earned)}</b>${spent > 0 ? ` and spent <b>${fmt(spent)}</b>` : ""}!</div>` : "";
    let lastDay = "";
    shown.forEach(t => {
      const day = dayLabel(t.created_at);
      if(day !== lastDay){ h += `<div class="cat-label">${day}</div>`; lastDay = day; }
      const l = storyLine(t);
      const cls = t.status === "pending" ? " pending" : t.status === "rejected" ? " rejected" : "";
      h += `<div class="story-row${cls}"><div class="story-emoji" aria-hidden="true">${l.emoji}</div><div class="story-text">${l.text}</div><div class="story-amt ${t.amount < 0 ? "cost" : ""}">${t.amount < 0 ? "-" : "+"}${fmt(Math.abs(t.amount))}</div></div>`;
    });
    return h;
  }

  function dueText(iso){
    if(!iso) return "";
    const today = localISO(new Date());
    if(iso === today) return "due today";
    const t = new Date(); t.setDate(t.getDate() + 1);
    if(iso === localISO(t)) return "due tomorrow";
    if(iso < today) return "was due " + new Date(iso + "T00:00:00").toLocaleDateString(undefined, {weekday:"long"});
    return "due " + new Date(iso + "T00:00:00").toLocaleDateString(undefined, {weekday:"long"});
  }
  function speakText(text){
    try{ if(window.speechSynthesis){ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = .9; speechSynthesis.speak(u); } }catch(e){}
  }
  function choreCard(chore, opts){
    const theme = document.body.dataset.kid || "";
    const title = chore ? chore.title : "Chore";
    const pay = chore ? fmt(chore.default_payout) : "";
    const sub = [pay, opts.due ? dueText(opts.due) : ""].filter(Boolean).join(" · ");
    let act = "";
    if(opts.state === "submitted"){
      act = `<span class="cc-wait">${theme === "anna" ? "💤 Waiting for Mom" : theme === "ryan" ? "SENT. Pending approval." : "Submitted"}</span>`;
    } else if(opts.markId){
      act = `<button class="cc-btn" type="button" data-cmark="${opts.markId}">${theme === "ryan" ? "Mark done" : "I did it!"}</button>`;
    } else {
      act = `<button class="cc-btn" type="button" data-cearn="${chore.id}">${theme === "ryan" ? "Log it " : "I did it! "}${pay}</button>`;
    }
    const say = theme === "anna" ? `<button class="cc-say" type="button" data-say="${escapeHtml(title + (pay ? ". It pays " + pay.replace("$", "") + " dollars." : ""))}" aria-label="Read aloud">🔊</button>` : "";
    return `<div class="chore-card${opts.state === "submitted" ? " sent" : ""}"><div class="cc-ic">${choreEmoji(chore)}</div>
      <div class="cc-body"><div class="cc-title">${escapeHtml(title)} ${say}</div><div class="cc-sub">${sub}</div></div><div class="cc-act">${act}</div></div>`;
  }
  // Tap feedback: the button turns into a happy "Sent!" and a few coins pop, then the real action runs.
  function wireChoreCards(){
    app.querySelectorAll(".cc-say").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); speakText(b.dataset.say); }));
    app.querySelectorAll(".cc-btn").forEach(btn => btn.addEventListener("click", () => {
      if(btn.dataset.busy) return;
      btn.dataset.busy = "1";
      btn.classList.add("popped"); btn.textContent = document.body.dataset.kid === "ryan" ? "SENT ✓" : "Sent! ✓";
      const card = btn.closest(".chore-card"); if(card) card.classList.add("celebrate");
      const r = btn.getBoundingClientRect();
      for(let i = 0; i < 6; i++){
        const c = document.createElement("span"); c.className = "coin-pop"; c.textContent = document.body.dataset.kid === "ryan" ? "+" : "🪙";
        c.style.left = (r.left + r.width / 2 + (Math.random() * 60 - 30)) + "px"; c.style.top = (r.top + 6) + "px"; c.style.animationDelay = (i * 60) + "ms";
        document.body.appendChild(c); setTimeout(() => c.remove(), 1300);
      }
      // Let the happy animation play, then do the real thing (the helpers already ignore a double tap).
      setTimeout(() => {
        if(btn.dataset.cmark){ const log = state.logs.find(l => l.id === btn.dataset.cmark); if(log) markChoreDone(log); }
        else { const chore = state.chores.find(c => c.id === btn.dataset.cearn); if(chore) submitChore(chore, state.activeMemberId); }
      }, 650);
    }));
  }

  function renderKidHome(){
    const m = activeMember();
    const myLogs = state.logs.filter(l => l.assigned_member_id === m.id && ["pending","submitted"].includes(l.status));
    const myPendingTxns = state.txns.filter(t => t.member_id === m.id && t.status === "pending");

    let body = "";
    if(state.kidTab === "chores"){
      if(!myLogs.length && !myPendingTxns.filter(t=>t.type==="earn"&&!t.chore_log_id).length){
        body = `<div class="empty-note">${document.body.dataset.kid === "anna" ? "🎉 All done for now! Check “Earn More” if you want to help out more." : "No assigned chores right now. Check “Earn More” to log extra work."}</div>`;
      }
      myLogs.forEach(log => {
        const rule = state.rules.find(r => r.id === log.assignment_rule_id);
        const chore = rule && state.chores.find(c => c.id === rule.chore_id);
        body += choreCard(chore, {due: log.due_date, state: log.status === "pending" ? "todo" : "submitted", markId: log.status === "pending" ? log.id : null});
      });
    } else if(state.kidTab === "earn"){
      const byCat = {};
      state.chores.forEach(c => { (byCat[c.category] = byCat[c.category] || []).push(c); });
      Object.keys(byCat).forEach(cat => {
        body += `<div class="cat-label">${escapeHtml(cat)}</div>`;
        byCat[cat].forEach(c => {
          body += choreCard(c, {});
        });
      });
    } else if(state.kidTab === "shop"){
      const rate = Number(state.household.screen_time_rate) || 5;
      const storeOpen = isStoreOpen();
      const spendable = spendableFor(m);
      const pendingScreen = state.txns.some(t => t.member_id === m.id && t.status === "pending" && t.screen_minutes);
      // Cap the stepper at what they can actually pay for (never below 5).
      const maxMinutes = Math.max(5, Math.floor(spendable * rate / 5) * 5);
      if(state.stMinutes == null || state.stMinutes < 5) state.stMinutes = 15;
      if(state.stMinutes > maxMinutes) state.stMinutes = maxMinutes;
      const canBuy = storeOpen && !m.bankrupt && !pendingScreen && spendable >= screenTimeCost(state.stMinutes);
      const buyLabel = !storeOpen ? "Store's closed"
        : m.bankrupt ? "Bankruptcy protection"
        : pendingScreen ? "Request already waiting"
        : spendable < screenTimeCost(state.stMinutes) ? "Not enough yet"
        : `Request for <span id="stCost">${fmt(screenTimeCost(state.stMinutes))}</span>`;
      const ss = storeStatus();
      const shopTheme = kidTheme(m);
      body += `<div class="storefront ${ss.open ? "open" : "closed"}">
        <div class="awning" aria-hidden="true"></div>
        <div class="sf-body">
          <div class="sf-name">${shopTheme === "ryan" ? "SHOP.EXE" : shopTheme === "anna" ? "🛍️ " + escapeHtml(m.name) + "'s Shop" : "🛍️ The Shop"}</div>
          <div class="sf-sign">${ss.open ? "🟢 We're open!" : "🌙 Closed for now"}</div>
          <div class="sf-when">${ss.text}</div>
          <div class="sf-hours">${STORE_HOURS_TEXT}</div>
        </div>
      </div>`;
      body += `<div class="cat-label">Buy Screen Time</div>
        <div class="card" style="margin-bottom:16px;">
          <div style="font-size:0.8rem;color:var(--text-dim);margin-bottom:10px;">$1 = ${rate} min · you can spend ${fmt(Math.max(0, spendable))}</div>
          <div style="display:flex;align-items:center;gap:12px;justify-content:center;">
            <button class="pill-btn outline" id="stMinus" type="button" ${storeOpen ? "" : "disabled"}>−5</button>
            <div style="text-align:center;min-width:70px;">
              <div style="font-size:1.4rem;font-weight:800;" id="stMinutes">${state.stMinutes}</div>
              <div style="font-size:0.72rem;color:var(--text-dim);">minutes</div>
            </div>
            <button class="pill-btn outline" id="stPlus" type="button" ${storeOpen ? "" : "disabled"}>+5</button>
          </div>
          <button class="primary-btn gold" id="stBuy" style="background:var(--gold);color:#3a2b05;" ${canBuy ? "" : "disabled"}>${buyLabel}</button>
        </div>`;
      const byCat = {};
      state.rewards.forEach(r => { (byCat[r.category] = byCat[r.category] || []).push(r); });
      const catOrder = Object.keys(byCat).sort((x, y) => (x === "Pets & Accessories" ? -1 : 0) - (y === "Pets & Accessories" ? -1 : 0));
      catOrder.forEach(cat => {
        body += `<div class="cat-label">${escapeHtml(cat)}</div><div class="shop-grid">`;
        byCat[cat].forEach(r => {
          const afford = spendable >= Number(r.cost) && !m.bankrupt;
          // Pets/accessories are one-per-kid: once bought (or requested) the button says so instead of letting a second one through.
          const mineFor = st => r.grants && state.txns.some(t => t.member_id === m.id && t.reward_item_id === r.id && t.type === "spend" && t.status === st);
          const ownedItem = mineFor("approved"), waitingItem = !ownedItem && mineFor("pending");
          const btnLabel = ownedItem ? "Owned ✓" : waitingItem ? "Waiting…" : fmt(r.cost);
          const shortTitle = String(r.title).replace(/^(Pet|Accessory):\s*/, "");
          body += `<div class="shop-card${ownedItem ? " owned" : ""}">
            <div class="shop-pic">${shopPicture(r)}</div>
            <div class="shop-title">${escapeHtml(shortTitle)}</div>
            <button class="pill-btn gold shop-buy" data-spend="${r.id}" ${(afford && storeOpen && !ownedItem && !waitingItem) ? "" : "disabled"}>${btnLabel}</button>
            ${(ownedItem || waitingItem) ? "" : `<button class="pill-btn outline small goal-star${m.goal_reward_id === r.id ? " on" : ""}" type="button" data-goal="${r.id}" title="Save for this">${m.goal_reward_id === r.id ? "⭐ Goal" : "☆ Save"}</button>`}
          </div>`;
        });
        body += `</div>`;
      });
    } else if(state.kidTab === "activity"){
      body = activityView(m, kidTheme(m));
    }

    const theme = kidTheme(m);
    document.body.dataset.kid = theme;
    app.innerHTML = `
      ${theme === "ryan" ? `<div class="r-bar"><span>C:\\MOMMA_BANK\\WALLET.EXE</span><span>_ □ X</span></div>` : ""}
      ${switchProfileHeader()}
      ${walletHero(m, theme)}
      ${goalCard(m, theme)}
      ${screenTimeCard(m, false)}
      <div class="tab-row">
        <button class="tab-btn ${state.kidTab==="chores"?"active":""}" data-tab="chores">My Chores</button>
        <button class="tab-btn ${state.kidTab==="earn"?"active":""}" data-tab="earn">Earn More</button>
        <button class="tab-btn ${state.kidTab==="shop"?"active":""}" data-tab="shop">Shop</button>
        <button class="tab-btn ${state.kidTab==="activity"?"active":""}" data-tab="activity">Activity</button>
      </div>
      ${body}
      <div class="device-note">${getDeviceProfile() === m.id
        ? `This device opens straight to ${escapeHtml(m.name)}. <button type="button" id="deviceProfileToggle">Stop doing that</button>`
        : `<button type="button" id="deviceProfileToggle">Always open as ${escapeHtml(m.name)} on this device</button>`}</div>
    `;
    wireKidHome();
    const kidDeviceToggle = document.getElementById("deviceProfileToggle");
    if(kidDeviceToggle) kidDeviceToggle.addEventListener("click", () => {
      setDeviceProfile(getDeviceProfile() === m.id ? null : m.id);
      showToast(getDeviceProfile() === m.id ? `This device now opens as ${m.name}` : "Back to asking who's using it");
      render();
    });
    maybeShowKidNotice(m);
  }

  function wireKidHome(){
    document.getElementById("switchProfileBtn").addEventListener("click", () => { state.view = "picker"; render(); });
    app.querySelectorAll("[data-tab]").forEach(btn => btn.addEventListener("click", () => { state.kidTab = btn.dataset.tab; render(); }));
    app.querySelectorAll("[data-mark]").forEach(btn => btn.addEventListener("click", () => {
      const log = state.logs.find(l => l.id === btn.dataset.mark);
      markChoreDone(log);
    }));
    app.querySelectorAll("[data-earn]").forEach(btn => btn.addEventListener("click", () => {
      const chore = state.chores.find(c => c.id === btn.dataset.earn);
      submitChore(chore, state.activeMemberId);
    }));
    app.querySelectorAll("[data-spend]").forEach(btn => btn.addEventListener("click", () => {
      const item = state.rewards.find(r => r.id === btn.dataset.spend);
      requestReward(item, state.activeMemberId);
    }));
    app.querySelectorAll("[data-goal]").forEach(btn => btn.addEventListener("click", () => {
      const m2 = activeMember();
      setGoal(m2.id, m2.goal_reward_id === btn.dataset.goal ? null : btn.dataset.goal);
    }));
    const gp = document.getElementById("goalPick");
    if(gp) gp.addEventListener("click", () => { state.kidTab = "shop"; render(); window.scrollTo({top: document.body.scrollHeight * 0.3, behavior: "smooth"}); });
    const gs = document.getElementById("goalShop");
    if(gs) gs.addEventListener("click", () => { state.kidTab = "shop"; render(); });
    const startBtn = app.querySelector("[data-start-session]");
    if(startBtn) startBtn.addEventListener("click", () => startScreenSession(startBtn.dataset.startSession));
    app.querySelectorAll("[data-end-session]").forEach(btn => btn.addEventListener("click", () => finishScreenSession(btn.dataset.endSession)));
    wireScreenTimeStepper();
    wireChoreCards();
  }

  // Shared between kid Shop tab wiring — the stepper has no server round
  // trip until "Request" is pressed, so +5/-5 just update the two on-screen
  // numbers directly.
  function wireScreenTimeStepper(){
    const minutesEl = document.getElementById("stMinutes");
    if(!minutesEl) return;
    // The chosen amount lives in state so it survives a re-render instead of
    // snapping back to 15 under the kid's thumb. Changing it re-renders the
    // Shop (cheap, local) so the price, the affordability check and the
    // button label all stay in agreement.
    document.getElementById("stMinus").addEventListener("click", () => { state.stMinutes = Math.max(5, state.stMinutes - 5); render(); });
    document.getElementById("stPlus").addEventListener("click", () => { state.stMinutes += 5; render(); });
    document.getElementById("stBuy").addEventListener("click", () => requestScreenTime(state.stMinutes, state.activeMemberId));
  }

  // ------------------------------------------------------------- Banker desk
  // Quick tab: pick who, tap what. The kid selection is remembered on this
  // device, so the usual case (same kid again) is a single tap. Most-used
  // fines and awards float to the top; the rest are behind "show all".
  const QUICK_KIDS_KEY = "mm_quick_kids_v1";
  function quickSelectedKids(kids){
    if(state.quickKids == null){
      let saved = [];
      try{ saved = JSON.parse(localStorage.getItem(QUICK_KIDS_KEY) || "[]"); }catch(e){}
      state.quickKids = saved.filter(id => kids.some(k => k.id === id));
      if(!state.quickKids.length && kids.length === 1) state.quickKids = [kids[0].id];
    }
    return state.quickKids;
  }
  function renderQuickBody(me){
    const kids = state.members.filter(m => m.role === "kid");
    if(!kids.length) return `<div class="empty-note">Add a kid first (Manage tab).</div>`;

    const used = {};
    state.txns.forEach(t => { used[t.description] = (used[t.description] || 0) + 1; });
    const byUse = (a, b) => (used[b] || 0) - (used[a] || 0);
    const fines = state.fines.slice().sort((a, b) => byUse(a.title, b.title) || a.title.localeCompare(b.title));
    const awards = state.chores.slice().sort((a, b) => byUse(a.title, b.title) || a.title.localeCompare(b.title));

    let html = "";

    html += `<div class="cat-label" style="margin-top:0;">Who is it for?</div>
      <div class="quick-kids">${kids.map(k => `<button type="button" class="quick-kid${selected.includes(k.id) ? " selected" : ""}" data-quick-kid="${k.id}">
        <span class="avatar">${k.avatar_emoji}</span><span>${escapeHtml(k.name)}</span><small>${k.bankrupt ? "bankrupt" : fmt(k.current_balance)}</small>
      </button>`).join("")}</div>`;

    html += `<div class="cat-label">Fine</div><div class="quick-grid">${showFines.map(f =>
      `<button type="button" class="quick-btn bad" data-quick-fine="${f.id}"><span>${escapeHtml(f.title)}</span><b>−${fmt(f.amount)}</b></button>`).join("")}</div>`;
    if(fines.length > 6) html += `<button type="button" class="link-btn" id="quickMoreFines">${state.quickAllFines ? "Show fewer" : `Show all ${fines.length} fines`}</button>`;

    html += `<div class="cat-label">Award</div><div class="quick-grid">${showAwards.map(c =>
      `<button type="button" class="quick-btn good" data-quick-award="${c.id}"><span>${escapeHtml(c.title)}</span><b>+${fmt(c.default_payout)}</b></button>`).join("")}</div>`;
    if(awards.length > 6) html += `<button type="button" class="link-btn" id="quickMoreAwards">${state.quickAllAwards ? "Show fewer" : `Show all ${awards.length} awards`}</button>`;

    html += `<button type="button" class="pill-btn outline" id="quickCustom" style="margin-top:14px;">＋ Something else (custom)</button>`;
    return html;
  }

  function wireBankerDesk(){
    document.getElementById("switchProfileBtn").addEventListener("click", () => { state.view = "picker"; render(); });
