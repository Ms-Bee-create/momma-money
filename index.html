<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Momma Money</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1f6b4a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --green:#1f6b4a; --green-dark:#164f37; --green-light:#e4f0e9;
    --gold:#d4a017; --gold-dark:#a97e0f; --gold-light:#faf1d9;
    --cream:#fbf7ee; --panel:#ffffff; --border:#e6ddc9;
    --text:#2c2a24; --text-dim:#7a7568; --red:#b3423a; --red-light:#fbe7e5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--cream);color:var(--text);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 100px;min-height:100vh;}
  header.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  header.app-header h1{font-size:1.4rem;margin:0;color:var(--green-dark);}
  header.app-header h1 .dot{color:var(--gold);}
  .icon-btn{
    border:none;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:8px 12px;font-size:1.1rem;cursor:pointer;
  }
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px;}
  .kicker{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gold-dark);margin-bottom:6px;}
  h2{margin:0 0 10px;font-size:1.15rem;}

  /* Profile picker */
  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;}
  .profile-card{
    border-radius:20px;border:2px solid var(--border);background:var(--panel);
    padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
    cursor:pointer;font:inherit;font-weight:700;color:var(--text);
  }
  .profile-card .avatar{font-size:2.4rem;}
  .profile-card .bal{font-size:0.8rem;color:var(--text-dim);font-weight:600;}
  .profile-card.banker{border-color:var(--gold);background:var(--gold-light);}
  .profile-card.bankrupt{border-color:var(--red);}
  .profile-card.bankrupt .bal{color:var(--red);}
  .add-member-card{
    border-radius:20px;border:2px dashed var(--border);background:none;
    padding:20px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;color:var(--text-dim);font:inherit;font-weight:700;min-height:110px;
  }

  /* Pin pad */
  .pin-dots{display:flex;gap:12px;justify-content:center;margin:18px 0;}
  .pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);}
  .pin-dots span.filled{background:var(--green);border-color:var(--green);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
  .pin-pad button{
    padding:16px;font-size:1.2rem;border-radius:14px;border:1px solid var(--border);
    background:var(--panel);cursor:pointer;font-weight:700;
  }
  .pin-pad button:active{background:var(--green-light);}

  /* Balance / wallet */
  .balance-hero{
    background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;
    border-radius:20px;padding:22px;text-align:center;margin-bottom:18px;
  }
  .balance-hero .label{font-size:0.78rem;opacity:0.85;text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
  .balance-hero .amount{font-size:2.6rem;font-weight:800;margin:4px 0;}
  .balance-hero .bankrupt-tag{
    display:inline-block;background:var(--red);color:#fff;font-size:0.75rem;font-weight:700;
    padding:4px 10px;border-radius:999px;margin-top:6px;
  }

  .tab-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
  .tab-btn{
    flex-shrink:0;padding:9px 16px;border-radius:999px;border:1px solid var(--border);
    background:var(--panel);font:inherit;font-size:0.85rem;font-weight:700;color:var(--text-dim);cursor:pointer;
  }
  .tab-btn.active{background:var(--green);border-color:var(--green);color:#fff;}

  .cat-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin:16px 0 8px;}
  .item-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;
  }
  .item-row .title{font-weight:700;font-size:0.92rem;}
  .item-row .sub{font-size:0.76rem;color:var(--text-dim);margin-top:2px;}
  .item-row .price{font-weight:800;color:var(--green-dark);white-space:nowrap;}
  .item-row .price.cost{color:var(--gold-dark);}
  .pill-btn{
    flex-shrink:0;border:none;background:var(--green);color:#fff;font:inherit;font-weight:700;
    font-size:0.8rem;padding:8px 14px;border-radius:999px;cursor:pointer;
  }
  .pill-btn.gold{background:var(--gold);color:#3a2b05;}
  .pill-btn.outline{background:none;border:1px solid var(--border);color:var(--text);}
  .pill-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .pill-btn.small{padding:6px 10px;font-size:0.72rem;}
  .status-tag{
    font-size:0.7rem;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;
  }
  .status-tag.pending{background:var(--gold-light);color:var(--gold-dark);}
  .status-tag.submitted{background:#e0eefc;color:#1a5c9c;}
  .status-tag.approved{background:var(--green-light);color:var(--green-dark);}
  .status-tag.rejected{background:var(--red-light);color:var(--red);}

  .empty-note{color:var(--text-dim);font-size:0.85rem;text-align:center;padding:20px 0;}

  /* Overlays */
  .overlay{
    position:fixed;inset:0;background:rgba(30,25,10,0.45);display:flex;align-items:flex-end;
    opacity:0;pointer-events:none;transition:opacity .15s;z-index:50;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    background:var(--cream);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;
    padding:22px 18px 28px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sheet-header h2{margin:0;}
  .sheet-close{background:none;border:none;font-size:1.4rem;color:var(--text-dim);cursor:pointer;line-height:1;}

  label.field-label{display:block;font-size:0.78rem;font-weight:700;color:var(--text-dim);margin:14px 0 6px;}
  .input-error{border-color:var(--red) !important;}
  .field-error-msg{color:var(--red);font-size:0.78rem;margin-top:5px;}
  input[type="text"], input[type="number"], input[type="email"], input[type="password"], select{
    width:100%;font:inherit;font-size:0.92rem;padding:11px 12px;border-radius:12px;
    border:1px solid var(--border);background:var(--panel);color:var(--text);
  }
  .choice-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .choice-chip{
    padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--panel);
    font:inherit;font-size:0.82rem;font-weight:700;color:var(--text-dim);cursor:pointer;
  }
  .choice-chip.selected{background:var(--green);border-color:var(--green);color:#fff;}
  .primary-btn{
    width:100%;margin-top:18px;padding:14px;border:none;border-radius:14px;background:var(--green);
    color:#fff;font:inherit;font-weight:800;font-size:0.95rem;cursor:pointer;
  }
  .primary-btn:disabled{opacity:0.45;cursor:not-allowed;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--green-dark);
    color:#fff;padding:11px 18px;border-radius:999px;font-size:0.85rem;font-weight:600;
    opacity:0;pointer-events:none;transition:all .25s;z-index:80;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .member-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;
  }
  .member-row .who{display:flex;align-items:center;gap:10px;}
  .member-row .who .avatar{font-size:1.6rem;}
  .member-row .who .name{font-weight:700;}
  .member-row .who .status{font-size:0.75rem;color:var(--text-dim);}

  /* Quick fine / award */
  .quick-kids{display:flex;gap:10px;flex-wrap:wrap;}
  .quick-kid{
    flex:1;min-width:140px;display:flex;flex-direction:row;align-items:center;gap:8px;
    padding:8px 12px;border-radius:14px;border:2px solid var(--border);background:var(--panel);
    font:inherit;font-weight:800;color:var(--text);cursor:pointer;
  }
  .quick-kid .avatar{font-size:1.5rem;}
  .quick-kid small{margin-left:auto;font-size:0.74rem;font-weight:600;color:var(--text-dim);}
  .quick-kid.selected{border-color:var(--green);background:var(--green-light);}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .quick-btn{
    display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:left;
    min-height:68px;padding:12px;border-radius:14px;border:1px solid var(--border);
    font:inherit;font-size:0.86rem;font-weight:700;color:var(--text);cursor:pointer;
  }
  .quick-btn b{font-size:1rem;}
  .quick-btn.bad{background:var(--red-light);border-color:#efc4c0;}
  .quick-btn.bad b{color:var(--red);}
  .quick-btn.good{background:var(--green-light);border-color:#bcd9c9;}
  .quick-btn.good b{color:var(--green-dark);}
  .quick-btn:active{transform:scale(0.97);}
  .link-btn{background:none;border:none;color:var(--green);font:inherit;font-size:0.82rem;font-weight:700;padding:10px 2px;cursor:pointer;text-decoration:underline;}

  .undo-bar{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);width:calc(100% - 32px);max-width:480px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--green-dark);color:#fff;padding:12px 14px;border-radius:14px;font-size:0.86rem;font-weight:600;
    opacity:0;pointer-events:none;transition:all .25s;z-index:90;
  }
  .undo-bar.show{opacity:1;pointer-events:auto;transform:translate(-50%,0);}
  .undo-bar button{border:none;background:var(--gold);color:#3a2b05;font:inherit;font-weight:800;padding:8px 14px;border-radius:999px;cursor:pointer;flex-shrink:0;}

  .notice-overlay{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:20px;}
  .notice-overlay.bad{background:rgba(140,40,34,0.94);}
  .notice-overlay.good{background:rgba(24,90,60,0.94);}
  .notice-card{background:var(--cream);border-radius:22px;padding:24px 20px;width:100%;max-width:380px;text-align:center;}
  .notice-emoji{font-size:3rem;}
  .notice-card h2{margin:6px 0 14px;font-size:1.4rem;}
  .notice-row{display:flex;justify-content:space-between;gap:12px;text-align:left;padding:10px 0;border-top:1px solid var(--border);font-size:0.95rem;}
  .notice-bal{margin-top:12px;font-weight:700;color:var(--text-dim);}
  .device-note{margin:26px 0 0;text-align:center;font-size:0.78rem;color:var(--text-dim);}
  .device-note button{background:none;border:none;color:var(--green);font:inherit;font-size:0.78rem;font-weight:700;text-decoration:underline;cursor:pointer;padding:2px;}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<div class="toast" id="toast">Saved</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";

  // ===========================================================================
  // Supabase — one anonymous identity per household device, same model as
  // Cracks. Kids don't get their own Supabase Auth account; profile switching
  // inside the app (with an optional PIN) is the access boundary for them.
  // ===========================================================================
  const SUPABASE_URL = "https://fbrnxuargsilbyyjrjop.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZicm54dWFyZ3NpbGJ5eWpyam9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDkxMDksImV4cCI6MjEwNTA4NTEwOX0.ycBWWu9U5H-KcZWdGGzFonGXxiSvlkDOYdCN_xtC47o";

  let supa = null, userId = null, remoteReady = false;

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // Returns the existing session, or null — no longer auto-creates an
  // anonymous one here. An anonymous session only ever gets created when
  // the person explicitly chooses "Set up a brand-new household" on the
  // login screen, since auto-creating one on every visit with no session
  // is exactly what made the artifact (a different origin, so it never
  // sees GitHub Pages' saved session) silently spin up an empty household
  // instead of showing a way back into the real one.
  async function initSupabase(){
    try{
      supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await supa.auth.getSession();
      remoteReady = true;
      return session;
    }catch(e){
      console.warn("Supabase unavailable:", e);
      remoteReady = false;
      return null;
    }
  }

  async function fetchAll(){
    const [
      { data: household }, { data: members }, { data: chores }, { data: rules }, { data: logs },
      { data: fines }, { data: rewards }, { data: txns }, { data: sessions }
    ] = await Promise.all([
      supa.from("households").select("*").eq("id", userId).maybeSingle(),
      supa.from("members").select("*").eq("household_id", userId).eq("archived", false).order("created_at"),
      supa.from("chore_templates").select("*").eq("household_id", userId).eq("archived", false).order("category"),
      supa.from("assignment_rules").select("*").eq("household_id", userId).eq("active", true),
      supa.from("chore_logs").select("*").eq("household_id", userId).order("due_date", { ascending: false }),
      supa.from("fine_templates").select("*").eq("household_id", userId).eq("archived", false),
      supa.from("reward_items").select("*").eq("household_id", userId).eq("archived", false).order("category"),
      supa.from("transactions").select("*").eq("household_id", userId).order("created_at", { ascending: false }).limit(200),
      supa.from("screen_sessions").select("*").eq("household_id", userId).order("created_at", { ascending: false }).limit(50)
    ]);
    return {
      household: household || { screen_time_rate: 5 },
      members: members || [], chores: chores || [], rules: rules || [], logs: logs || [],
      fines: fines || [], rewards: rewards || [], txns: txns || [], sessions: sessions || []
    };
  }

  // ===========================================================================
  // Local state — hydrated from Supabase, re-rendered on every mutation.
  // No offline fallback here (unlike Cracks): this app is meaningless without
  // shared server state since multiple household members read/write it.
  // ===========================================================================
  let state = {
    household: { screen_time_rate: 5 },
    members: [], chores: [], rules: [], logs: [], fines: [], rewards: [], txns: [], sessions: [],
    activeMemberId: null, view: "login", kidTab: "chores",
    pinBuffer: "", pinTargetMember: null,
    authUser: null // the Supabase auth user (email + is_anonymous), not a household member profile
  };

  // quiet = background poll: if nothing changed on the server, don't touch
  // the DOM at all. A full re-render wipes whatever the person is in the
  // middle of (a half-set screen-time stepper, a button mid-tap), so polling
  // only re-renders when there is actually something new to show.
  let lastDataSig = "";
  async function reload(quiet){
    const data = await fetchAll();
    await applyDueOvertimeCharges(data.members);
    const sig = JSON.stringify([data.household, data.members, data.txns, data.sessions, data.logs, data.chores, data.fines, data.rewards]);
    if(quiet && sig === lastDataSig) return;
    lastDataSig = sig;
    Object.assign(state, data);
    render();
  }

  // Local calendar date (YYYY-MM-DD). toISOString() is UTC, which for a US
  // evening is already "tomorrow" — that made "charge it tomorrow" land the
  // same evening.
  function localISO(d){
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  const round2 = n => Math.round(n * 100) / 100;

  // Ignores a second tap on the same action while the first is still in
  // flight. Without this a double-tap on "Earn More" created two or three
  // identical pending requests, and approving all of them paid out 2-3x.
  const inFlight = new Set();
  async function once(key, fn){
    if(inFlight.has(key)) return;
    inFlight.add(key);
    try{ return await fn(); } finally { inFlight.delete(key); }
  }

  // Balance changes are read-modify-write. Two people acting at once (Mom
  // approving while Dad fines) or one person double-tapping used to overwrite
  // each other, because the new balance was computed from a possibly stale
  // copy in memory. This re-reads the row, computes the change, and only
  // writes if the row is still exactly what was read — otherwise retries.
  async function adjustMember(memberId, compute){
    for(let attempt = 0; attempt < 6; attempt++){
      const { data: cur } = await supa.from("members").select("*").eq("id", memberId).maybeSingle();
      if(!cur) return null;
      const next = compute(cur);
      if(!next) return { before: cur, after: cur, unchanged: true };
      const { data: written } = await supa.from("members").update(next)
        .eq("id", memberId)
        .eq("current_balance", cur.current_balance)
        .eq("screen_minutes_balance", cur.screen_minutes_balance)
        .select();
      if(written && written.length) return { before: cur, after: written[0] };
    }
    return null;
  }

  function member(id){ return state.members.find(m => m.id === id); }
  function activeMember(){ return member(state.activeMemberId); }

  // The first parent profile is the household owner (lands on Approvals).
  // Any other parent (Dad) lands on Quick, because what they come for is a
  // fast fine or award, not a queue to work through.
  function isOwnerBanker(m){
    const bankers = state.members.filter(x => x.role === "banker");
    return bankers.length ? bankers[0].id === m.id : true;
  }
  function enterProfile(m){
    state.activeMemberId = m.id;
    state.view = "home";
    state.kidTab = m.role === "banker" ? (isOwnerBanker(m) ? "approvals" : "quick") : "chores";
  }

  // "This phone opens straight to Dad": remembered per device, so Dad's
  // Samsung goes icon -> Quick Fine with no sign-in screen, profile picker
  // or PIN in between.
  const DEVICE_PROFILE_KEY = "mm_device_profile_v1";
  function getDeviceProfile(){ try{ return localStorage.getItem(DEVICE_PROFILE_KEY); }catch(e){ return null; } }
  function setDeviceProfile(id){
    try{ if(id) localStorage.setItem(DEVICE_PROFILE_KEY, id); else localStorage.removeItem(DEVICE_PROFILE_KEY); }catch(e){}
  }
  function fmt(n){ return "$" + Number(n || 0).toFixed(2); }
  function activeSessionFor(memberId){
    return state.sessions.find(s => s.member_id === memberId && (s.status === "active" || s.status === "overtime"));
  }

  // Store hours gate purchasing (screen time + reward requests) in the Shop
  // tab — no override, so a closed store is really closed. Starting
  // already-banked screen time is unaffected: he can cash in minutes he's
  // already bought whenever he's ready, per the agreed design.
  function isStoreOpen(){
    const now = new Date();
    const day = now.getDay(); // 0 Sun .. 6 Sat
    const hour = now.getHours() + now.getMinutes() / 60;
    if(day >= 1 && day <= 5) return hour >= 15 && hour < 17;   // weekdays 3-5pm
    if(day === 6) return hour >= 9 && hour < 18;                // Saturday 9am-6pm
    return hour >= 12 && hour < 17;                             // Sunday 12pm-5pm
  }
  const STORE_HOURS_TEXT = "Weekdays 3–5pm · Saturdays 9am–6pm · Sundays 12pm–5pm";

  // A short, unmissable tone at zero — not just a color change on a card
  // that might be off-screen. Built with Web Audio instead of an audio file
  // so there's nothing extra to host or load.
  function playTimesUpTone(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      let t = ctx.currentTime;
      for(let i = 0; i < 3; i++){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.4);
        t += 0.45;
      }
    }catch(e){}
  }

  // Shared between the kid's own home and the Banker's Household tab, so
  // both ever show the exact same countdown — the whole point being that
  // the Banker can check remaining time without having to ask the kid.
  // Once it hits zero the session doesn't auto-end: it flips to "overtime"
  // and keeps counting UP in red, because anything played past zero is what
  // gets deducted from tomorrow's balance — the cost only exists if someone
  // actually has to stop it.
  function screenTimeCard(m, isBanker){
    const session = activeSessionFor(m.id);
    if(session){
      const isOvertime = session.status === "overtime";
      return `<div class="card" style="text-align:center;${isOvertime ? "border-color:var(--red);background:var(--red-light);" : ""}">
        <div class="kicker" style="${isOvertime ? "color:var(--red);" : ""}">${isOvertime ? "⏰ Time's up — playing overtime" : "Screen time running"}</div>
        <div style="font-size:3.2rem;line-height:1.1;font-weight:800;${isOvertime ? "color:var(--red);" : "color:var(--green-dark);"}" data-countdown="${session.ends_at}" data-session-id="${session.id}" data-session-status="${session.status}" data-member-id="${session.member_id}">--:--</div>
        ${isOvertime ? `<div style="font-size:0.8rem;color:var(--red);margin:2px 0 8px;">Comes out of tomorrow's balance</div>` : ""}
        <button class="pill-btn ${isOvertime ? "" : "outline"} small" data-end-session="${session.id}" style="margin-top:8px;">${isOvertime ? "Stop now" : "Stop early"}</button>
      </div>`;
    }
    if((m.screen_minutes_balance || 0) > 0){
      return `<div class="card" style="text-align:center;">
        <div class="kicker">Screen time banked</div>
        <div style="font-size:1.6rem;font-weight:800;">${m.screen_minutes_balance} min</div>
        ${isBanker
          ? `<div style="font-size:0.8rem;color:var(--text-dim);">Not started yet</div>`
          : `<button class="pill-btn" data-start-session="${m.id}" style="margin-top:8px;">▶ Start screen time</button>`}
      </div>`;
    }
    return "";
  }

  // ===========================================================================
  // Mutations
  // ===========================================================================
  // opts.quiet = caller handles the toast/refresh itself (Quick Fine does
  // several in a row and shows one combined message). Returns the member's
  // before/after rows on success so a caller can offer an exact undo.
  async function approveTransaction(txn, opts){
    const quiet = !!(opts && opts.quiet);
    return once("approve:" + txn.id, async () => {
      const m = member(txn.member_id);
      if(!m) return null;
      const amount = Number(txn.amount);
      const fresh = await supa.from("members").select("current_balance").eq("id", m.id).maybeSingle();
      // A purchase has to be covered by the balance. A fine can overdraw
      // (that's what bankruptcy is for), but approving a purchase the kid
      // can't afford used to floor them at $0 and hand over the item free.
      if(txn.type === "spend" && fresh.data && Number(fresh.data.current_balance) + amount < 0){
        showToast(`Can't approve — ${m.name} only has ${fmt(fresh.data.current_balance)}`);
        return null;
      }
      // Claim the request first. If someone else (or a second tap) already
      // approved or declined it, this matches nothing and we stop — that is
      // what stops one request from paying out twice.
      const { data: claimed } = await supa.from("transactions")
        .update({ status: "approved", resolved_at: new Date().toISOString() })
        .eq("id", txn.id).eq("status", "pending").select();
      if(!claimed || !claimed.length){
        if(!quiet){ showToast("Already handled"); reload(); }
        return null;
      }
      // Approving a screen-time purchase banks the minutes rather than
      // starting them immediately — the kid (or Banker) starts the actual
      // countdown separately, whenever they're really about to use it.
      const result = await adjustMember(m.id, cur => {
        let bal = round2(Number(cur.current_balance) + amount);
        let bankrupt = cur.bankrupt;
        if(bal <= 0 && amount < 0){ bal = 0; bankrupt = true; }
        if(bal > 0 && amount > 0) bankrupt = false;
        const next = { current_balance: bal, bankrupt };
        if(txn.screen_minutes) next.screen_minutes_balance = (cur.screen_minutes_balance || 0) + txn.screen_minutes;
        return next;
      });
      if(!result){
        await supa.from("transactions").update({ status: "pending", resolved_at: null }).eq("id", txn.id);
        if(!quiet){ showToast("Couldn't update the balance — try again"); reload(); }
        return null;
      }
      if(txn.chore_log_id){
        await supa.from("chore_logs").update({ status: "approved", approved_at: new Date().toISOString() }).eq("id", txn.chore_log_id);
      }
      if(!quiet){
        showToast(`Approved — ${m.name}'s new balance ${fmt(result.after.current_balance)}`);
        reload();
      }
      return { before: result.before, after: result.after };
    });
  }

  async function rejectTransaction(txn){
    return once("reject:" + txn.id, async () => {
      const { data: claimed } = await supa.from("transactions")
        .update({ status: "rejected", resolved_at: new Date().toISOString() })
        .eq("id", txn.id).eq("status", "pending").select();
      if(claimed && claimed.length && txn.chore_log_id){
        await supa.from("chore_logs").update({ status: "rejected" }).eq("id", txn.chore_log_id);
      }
      showToast(claimed && claimed.length ? "Request declined" : "Already handled");
      reload();
    });
  }

  // A kid can't have two identical requests waiting at once. That is both
  // the double-tap guard and sensible on its own: the same chore can't be
  // earned twice before the first one has even been looked at.
  async function hasPendingRequest(memberId, description){
    const { data } = await supa.from("transactions").select("id")
      .eq("member_id", memberId).eq("description", description).eq("status", "pending").limit(1);
    return !!(data && data.length);
  }

  async function submitChore(chore, memberId){
    return once("submit:" + memberId + ":" + chore.id, async () => {
      if(await hasPendingRequest(memberId, chore.title)){
        showToast(`"${chore.title}" is already waiting on the Banker`);
        return;
      }
      await supa.from("transactions").insert({
        household_id: userId, member_id: memberId, type: "earn",
        amount: chore.default_payout, description: chore.title, status: "pending"
      });
      showToast(`Submitted "${chore.title}" for approval`);
      reload();
    });
  }

  // What a kid can still spend: balance minus everything they've already
  // asked for that is waiting on approval. Without subtracting the pending
  // requests, a kid with $5 could stack five $5 requests.
  function spendableFor(m){
    const pendingSpend = state.txns
      .filter(t => t.member_id === m.id && t.status === "pending" && t.type === "spend")
      .reduce((sum, t) => sum + Math.abs(Number(t.amount)), 0);
    return round2(Number(m.current_balance) - pendingSpend);
  }

  async function requestReward(item, memberId){
    return once("reward:" + memberId + ":" + item.id, async () => {
      const m = member(memberId);
      if(m && (m.bankrupt || spendableFor(m) < Number(item.cost))){
        showToast("Not enough in the balance for that yet");
        return;
      }
      if(await hasPendingRequest(memberId, item.title)){
        showToast(`"${item.title}" is already waiting on the Banker`);
        return;
      }
      await supa.from("transactions").insert({
        household_id: userId, member_id: memberId, type: "spend",
        amount: -Math.abs(item.cost), description: item.title, status: "pending", reward_item_id: item.id
      });
      showToast(`Requested "${item.title}" — waiting on the Banker`);
      reload();
    });
  }

  function screenTimeCost(minutes){
    const rate = Number(state.household.screen_time_rate) || 5; // minutes per $1
    return Math.round((minutes / rate) * 100) / 100;
  }

  async function requestScreenTime(minutes, memberId){
    return once("screen:" + memberId, async () => {
      const m = member(memberId);
      const cost = screenTimeCost(minutes);
      if(m && (m.bankrupt || spendableFor(m) < cost)){
        showToast(`Not enough — ${minutes} min costs ${fmt(cost)}`);
        return;
      }
      const hasPendingScreen = state.txns.some(t => t.member_id === memberId && t.status === "pending" && t.screen_minutes);
      if(hasPendingScreen){
        showToast("You already have a screen time request waiting");
        return;
      }
      await supa.from("transactions").insert({
        household_id: userId, member_id: memberId, type: "spend",
        amount: -cost, description: `${minutes} min screen time`, status: "pending", screen_minutes: minutes
      });
      showToast(`Requested ${minutes} min screen time — waiting on the Banker`);
      reload();
    });
  }

  // Cashes in a kid's entire banked (paid-for, not-yet-used) screen time
  // into one running countdown. Storing ends_at server-side (not just
  // ticking a local timer) is what lets the Banker's screen and the kid's
  // screen show the exact same time remaining without either device being
  // the "source of truth" — and it's what stops a kid from just closing
  // the tab to make more time appear later.
  async function startScreenSession(memberId){
    return once("start:" + memberId, async () => {
      // Only one running session per kid, checked against the server (not
      // the in-memory copy) so a second device can't start a parallel one.
      const { data: running } = await supa.from("screen_sessions").select("id")
        .eq("member_id", memberId).in("status", ["active", "overtime"]).limit(1);
      if(running && running.length){ showToast("Screen time is already running"); reload(); return; }
      // Zero the bank first and use what was actually in it. Whoever gets
      // here first takes the minutes; a double-tap finds an empty bank.
      const taken = await adjustMember(memberId, cur =>
        (cur.screen_minutes_balance || 0) > 0 ? { screen_minutes_balance: 0 } : null);
      const minutes = taken && !taken.unchanged ? (taken.before.screen_minutes_balance || 0) : 0;
      if(minutes <= 0){ reload(); return; }
      const startedAt = new Date();
      const endsAt = new Date(startedAt.getTime() + minutes * 60000);
      const { error } = await supa.from("screen_sessions").insert({
        household_id: userId, member_id: memberId, minutes,
        started_at: startedAt.toISOString(), ends_at: endsAt.toISOString(), status: "active"
      });
      if(error){
        await adjustMember(memberId, cur => ({ screen_minutes_balance: (cur.screen_minutes_balance || 0) + minutes }));
        showToast("Couldn't start — your minutes are safe, try again");
        reload();
        return;
      }
      showToast(`Screen time started — ${minutes} min`);
      reload();
    });
  }

  // Ends a session. Three situations:
  //  - stopped early: whatever was left goes back in the kid's bank, so
  //    stopping to eat dinner or an idle timeout never costs paid-for time
  //  - ran out and kept going (overtime): the extra minutes are costed at the
  //    household rate and charged against tomorrow, not today
  //  - endedAtMs lets the idle auto-stop count time up to the last touch
  //    instead of up to whenever the check finally noticed
  async function finishScreenSession(sessionId, opts){
    return once("finish:" + sessionId, async () => {
      const endedAt = (opts && opts.endedAtMs) || Date.now();
      // Claim the session so two taps or two devices can't both settle it
      // (which is how a single overtime used to be charged twice).
      const { data: claimed } = await supa.from("screen_sessions")
        .update({ status: "completed" }).eq("id", sessionId).in("status", ["active", "overtime"]).select();
      if(!claimed || !claimed.length){ reload(); return; }
      const session = claimed[0];
      const endsAtMs = new Date(session.ends_at).getTime();
      if(endedAt < endsAtMs){
        const unused = Math.floor((endsAtMs - endedAt) / 60000);
        if(unused > 0){
          await adjustMember(session.member_id, cur => ({ screen_minutes_balance: (cur.screen_minutes_balance || 0) + unused }));
          showToast(`Stopped — ${unused} min put back in the bank`);
        } else {
          showToast("Screen time ended");
        }
      } else {
        const overtimeMinutes = Math.ceil((endedAt - endsAtMs) / 60000);
        if(overtimeMinutes > 0){
          await chargeOvertimeTomorrow(session.member_id, overtimeMinutes);
          showToast(`Ended — ${overtimeMinutes} min overtime comes off tomorrow's balance`);
        } else {
          showToast("Screen time ended");
        }
      }
      reload();
    });
  }

  async function chargeOvertimeTomorrow(memberId, minutes){
    const rate = Number(state.household.screen_time_rate) || 5; // minutes per $1
    const cost = round2(minutes / rate);
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    // adjustMember (not a blind overwrite) so two overtimes ending close
    // together add up instead of one erasing the other.
    await adjustMember(memberId, cur => ({
      pending_overtime_charge: round2(Number(cur.pending_overtime_charge || 0) + cost),
      pending_overtime_charge_date: localISO(tomorrow)
    }));
  }

  // Runs on every reload — including from whatever other device/tab is also
  // polling (see startAutoRefresh), so two devices can genuinely race to
  // apply the same charge at nearly the same moment. The update below is an
  // optimistic-lock claim: it only clears pending_overtime_charge if it
  // still equals the exact amount we read, so whichever caller's write
  // lands first "wins" the charge, and the loser's update matches zero rows
  // and skips inserting a fine — instead of both of them charging it.
  async function applyDueOvertimeCharges(members){
    const today = localISO(new Date());
    const due = members.filter(m =>
      Number(m.pending_overtime_charge) > 0 && m.pending_overtime_charge_date && m.pending_overtime_charge_date <= today
    );
    for(const m of due){
      const cost = Number(m.pending_overtime_charge);
      const { data: claimed } = await supa.from("members")
        .update({ pending_overtime_charge: 0, pending_overtime_charge_date: null })
        .eq("id", m.id)
        .eq("pending_overtime_charge", cost)
        .select();
      if(!claimed || !claimed.length) continue; // another device already claimed this charge
      await supa.from("transactions").insert({
        household_id: userId, member_id: m.id, type: "fine",
        amount: -cost, description: "Overtime screen time (yesterday)",
        status: "approved", resolved_at: new Date().toISOString()
      });
      const result = await adjustMember(m.id, cur => {
        const bal = Math.max(0, round2(Number(cur.current_balance) - cost));
        return { current_balance: bal, bankrupt: bal <= 0 };
      });
      if(result){
        m.current_balance = result.after.current_balance;
        m.bankrupt = result.after.bankrupt;
      }
      m.pending_overtime_charge = 0;
      m.pending_overtime_charge_date = null;
    }
  }

  async function setScreenTimeRate(rate){
    await supa.from("households").update({ screen_time_rate: rate }).eq("id", userId);
    showToast("Screen time rate updated");
    reload();
  }

  // Inserts a transaction, recording which parent issued it when the
  // issued_by column exists. If the column hasn't been added to the database
  // yet, retry without it so fining never breaks over a missing migration.
  async function insertTxn(row){
    let res = await supa.from("transactions").insert(row).select().single();
    if(res.error && "issued_by" in row && /issued_by/i.test(res.error.message || "")){
      const rest = Object.assign({}, row);
      delete rest.issued_by;
      res = await supa.from("transactions").insert(rest).select().single();
    }
    return res;
  }

  async function issueFine(fine, memberId, customTitle, customAmount){
    const amount = -Math.abs(customAmount != null ? customAmount : fine.amount);
    const title = customTitle || fine.title;
    const { data } = await insertTxn({
      household_id: userId, member_id: memberId, type: "fine",
      amount, description: title, status: "pending", issued_by: state.activeMemberId
    });
    if(data) await approveTransaction(data);
  }

  // ---------------------------------------------------------------- Quick
  // One tap from a parent: fine or award one or more kids right now, no
  // approval queue (the parent IS the approval). Each one is applied through
  // the same approve path as everything else, so balances, bankruptcy and
  // the double-tap guards all behave identically.
  async function quickIssue(kind, label, amount, kidIds){
    if(!kidIds.length){ showToast("Tap who it's for first"); return; }
    return once("quick:" + kind + ":" + label + ":" + kidIds.join(","), async () => {
      const done = [];
      for(const kidId of kidIds){
        const signed = kind === "fine" ? -Math.abs(amount) : Math.abs(amount);
        const { data } = await insertTxn({
          household_id: userId, member_id: kidId, type: kind === "fine" ? "fine" : "earn",
          amount: signed, description: label, status: "pending", issued_by: state.activeMemberId
        });
        if(!data) continue;
        const info = await approveTransaction(data, { quiet: true });
        if(info) done.push({ txnId: data.id, kidId, before: info.before, after: info.after });
      }
      await reload();
      if(!done.length){ showToast("Couldn't save that — try again"); return; }
      const names = done.map(d => (member(d.kidId) || {}).name).filter(Boolean).join(" & ");
      const verb = kind === "fine" ? `Fined ${names} ${fmt(Math.abs(amount))}` : `Gave ${names} ${fmt(Math.abs(amount))}`;
      showUndoBar(`${verb} — ${label}`, () => undoQuick(done));
    });
  }

  // Undo only restores the exact balance from before, and only if nothing
  // else has touched that kid since — otherwise it would overwrite someone
  // else's change, so it refuses and says so.
  async function undoQuick(done){
    let failed = 0;
    for(const d of done){
      const { data: claimed } = await supa.from("transactions")
        .update({ status: "rejected", resolved_at: new Date().toISOString() })
        .eq("id", d.txnId).eq("status", "approved").select();
      if(!claimed || !claimed.length){ failed++; continue; }
      const restored = await adjustMember(d.kidId, cur =>
        Number(cur.current_balance) === Number(d.after.current_balance)
          ? { current_balance: d.before.current_balance, bankrupt: d.before.bankrupt } : null);
      if(!restored || restored.unchanged){
        await supa.from("transactions").update({ status: "approved" }).eq("id", d.txnId);
        failed++;
      }
    }
    showToast(failed ? "Couldn't undo — their balance changed since" : "Undone");
    reload();
  }

  let undoTimer = null;
  function showUndoBar(text, onUndo){
    let bar = document.getElementById("undoBar");
    if(!bar){
      bar = document.createElement("div");
      bar.id = "undoBar";
      bar.className = "undo-bar";
      document.body.appendChild(bar);
    }
    bar.innerHTML = `<span></span><button type="button">Undo</button>`;
    bar.firstChild.textContent = text;
    bar.classList.add("show");
    clearTimeout(undoTimer);
    const hide = () => bar.classList.remove("show");
    bar.querySelector("button").onclick = () => { hide(); clearTimeout(undoTimer); onUndo(); };
    undoTimer = setTimeout(hide, 9000);
  }

  // ------------------------------------------------- "You were fined" notice
  // A fine that the kid never sees teaches nothing, and a parent who sees no
  // reaction stops bothering. When a kid opens their own profile on a device,
  // anything a parent fined or awarded since they last looked is shown full
  // screen once. Tracked per device, and the first visit on a device doesn't
  // replay history.
  function maybeShowKidNotice(m){
    if(document.getElementById("kidNotice")) return;
    const key = "mm_notice_ack_" + m.id;
    let ack = 0;
    try{ ack = Number(localStorage.getItem(key)) || 0; }catch(e){}
    if(!ack){
      try{ localStorage.setItem(key, String(Date.now())); }catch(e){}
      return;
    }
    const fresh = state.txns.filter(t =>
      t.member_id === m.id && t.status === "approved" && t.resolved_at &&
      (t.type === "fine" || (t.type === "earn" && t.issued_by)) &&
      new Date(t.resolved_at).getTime() > ack
    ).sort((a, b) => new Date(a.resolved_at) - new Date(b.resolved_at));
    if(!fresh.length) return;
    const hasFine = fresh.some(t => t.type === "fine");
    const rows = fresh.map(t => {
      const by = t.issued_by && member(t.issued_by) ? ` · from ${escapeHtml(member(t.issued_by).name)}` : "";
      return `<div class="notice-row"><span>${escapeHtml(t.description)}${by}</span><b>${t.amount < 0 ? "−" : "+"}${fmt(Math.abs(t.amount))}</b></div>`;
    }).join("");
    const overlay = document.createElement("div");
    overlay.id = "kidNotice";
    overlay.className = "notice-overlay " + (hasFine ? "bad" : "good");
    overlay.innerHTML = `<div class="notice-card">
      <div class="notice-emoji">${hasFine ? "⚠️" : "🌟"}</div>
      <h2>${hasFine ? "Heads up" : "Nice work!"}</h2>
      ${rows}
      <div class="notice-bal">Your balance: ${fmt(m.current_balance)}</div>
      <button class="primary-btn" type="button">OK</button>
    </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector("button").addEventListener("click", () => {
      const newest = Math.max.apply(null, fresh.map(t => new Date(t.resolved_at).getTime()));
      try{ localStorage.setItem(key, String(newest)); }catch(e){}
      overlay.remove();
    });
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = hasFine ? "square" : "sine";
      osc.frequency.value = hasFine ? 220 : 660;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.55);
    }catch(e){}
  }

  async function assignChore(chore, memberId){
    let { data: rule } = await supa.from("assignment_rules").insert({
      household_id: userId, chore_id: chore.id, assigned_member_id: memberId,
      frequency_type: "interval", interval_days: 0
    }).select().single();
    await supa.from("chore_logs").insert({
      household_id: userId, assignment_rule_id: rule.id, assigned_member_id: memberId,
      due_date: new Date().toISOString().slice(0,10), status: "pending"
    });
    showToast(`Assigned "${chore.title}"`);
    reload();
  }

  async function markChoreDone(log){
    return once("done:" + log.id, async () => {
      // Claim the chore log first (pending -> submitted) so a double-tap
      // can only ever create one payout request for it.
      const { data: claimed } = await supa.from("chore_logs")
        .update({ status: "submitted", submitted_at: new Date().toISOString() })
        .eq("id", log.id).eq("status", "pending").select();
      if(!claimed || !claimed.length){ reload(); return; }
      const rule = state.rules.find(r => r.id === log.assignment_rule_id);
      const chore = rule && state.chores.find(c => c.id === rule.chore_id);
      await supa.from("transactions").insert({
        household_id: userId, member_id: log.assigned_member_id, type: "earn",
        amount: chore ? chore.default_payout : 0, description: chore ? chore.title : "Assigned chore",
        status: "pending", chore_log_id: log.id
      });
      showToast("Marked done — waiting on the Banker");
      reload();
    });
  }

  async function addMember(name, role, emoji, pin){
    await supa.from("members").insert({ household_id: userId, name, role, avatar_emoji: emoji, pin: pin || null });
    showToast(`${name} added`);
    reload();
  }

  // ===========================================================================
  // Rendering
  // ===========================================================================
  const app = document.getElementById("app");

  const SETUP_DONE_KEY = "mm_setup_done_v1";

  function render(){
    if(state.view === "login") renderLogin();
    else if(state.view === "setup") renderSetup();
    else if(state.view === "picker") renderPicker();
    else if(state.view === "pin") renderPinPad();
    else {
      const m = activeMember();
      if(!m){ state.view = "picker"; renderPicker(); }
      else if(m.role === "banker") renderBankerDesk();
      else renderKidHome();
    }
    startCountdownTicker();
  }

  // Ticks any visible screen-time countdown once a second by writing
  // straight to the DOM, instead of re-running the full render() loop —
  // a full re-render every second would fight the user for scroll
  // position and cursor focus. Reads ends_at (set server-side when the
  // session started) off each element's own dataset, so it's always
  // computing "how long is actually left" fresh rather than trusting a
  // number that could drift.
  // There's no realtime subscription — a screen left open (say, the
  // Banker's tablet sitting on the counter) never hears about a chore
  // submission or screen-time request that happens on someone else's
  // device. Tab switches and button clicks only re-fetch as a side effect
  // of a mutation, not on their own. This polls quietly in the background
  // so "the kid just asked" actually shows up without anyone having to
  // manually reload the page — but skips a beat while a sheet is open or
  // someone's mid-typing, so it never yanks focus out from under them.
  let autoRefreshInterval = null;
  function startAutoRefresh(){
    clearInterval(autoRefreshInterval);
    autoRefreshInterval = setInterval(() => {
      const active = document.activeElement;
      const typing = active && ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName);
      const sheetOpen = document.querySelector(".overlay.open");
      if(!typing && !sheetOpen && !document.hidden) reload(true);
    }, 15000);
    // Coming back to the app (unlocking the phone, switching tabs) should
    // show current data right away, not up to 15 seconds later.
    if(!startAutoRefresh.wired){

  // "Ryan left his timer running" safeguard: if the device showing his own
  // running countdown gets no touch/click/key/scroll for 10 minutes, we
  // treat that as him having walked away (or fallen asleep) and stop the
  // session right there — capping how much overtime can ever pile up
  // unattended instead of letting it run indefinitely until someone
  // happens to open the app again. Only fires on the kid's OWN home screen
  // (state.activeMemberId matches the session's member) so a Banker's
  // tablet sitting idle on the Household tab never stops a kid's session
  // that's actually still running fine on his own device.
  const IDLE_TIMEOUT_MS = 10 * 60 * 1000;
  let lastActivityAt = Date.now();
  ["mousemove", "mousedown", "keydown", "touchstart", "scroll"].forEach(evt => {
    document.addEventListener(evt, () => { lastActivityAt = Date.now(); }, { passive: true });
  });

  let countdownInterval = null;
  function startCountdownTicker(){
    clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      document.querySelectorAll("[data-countdown]").forEach(el => {
        const endsAt = new Date(el.dataset.countdown).getTime();
        const remainingMs = endsAt - Date.now();
        const isOwnScreen = state.activeMemberId === el.dataset.memberId;
        if(isOwnScreen && !el.dataset.idleStopFired && (Date.now() - lastActivityAt) > IDLE_TIMEOUT_MS){
          el.dataset.idleStopFired = "1";
          // Count time only up to the last touch, and (if it was still
          // within the paid-for time) the unused minutes go back in the bank.
          finishScreenSession(el.dataset.sessionId, { endedAtMs: lastActivityAt });
          return;
        }
        if(remainingMs <= 0){
          // Past zero: keep counting UP instead of stopping, since the whole
          // point is that overtime is visible and has a real cost, not a
          // dead "Time's up!" label the kid can ignore.
          const overtimeSec = Math.floor(-remainingMs / 1000);
          const mm = Math.floor(overtimeSec / 60);
          const ss = overtimeSec % 60;
          el.textContent = `+${mm}:${String(ss).padStart(2, "0")}`;
          if(!el.dataset.overtimeFired){
            el.dataset.overtimeFired = "1";
            if(el.dataset.sessionStatus === "active"){
              playTimesUpTone();
              const sess = state.sessions.find(s => s.id === el.dataset.sessionId);
              if(sess) sess.status = "overtime";
              supa.from("screen_sessions").update({ status: "overtime" }).eq("id", el.dataset.sessionId);
              // Re-render now so the card switches to its red overtime look
              // (border, "Comes out of tomorrow's balance") without waiting
              // for the next unrelated navigation.
              render();
            }
          }
        } else {
          const totalSec = Math.ceil(remainingMs / 1000);
          const mm = Math.floor(totalSec / 60);
          const ss = totalSec % 60;
          el.textContent = `${mm}:${String(ss).padStart(2, "0")}`;
        }
      });
    }, 1000);
  }

  const QUICK_KIDS_KEY = "mm_quick_kids_v1";
  function quickSelectedKids(kids){
    if(state.quickKids == null){
      let saved = [];
      try{ saved = JSON.parse(localStorage.getItem(QUICK_KIDS_KEY) || "[]"); }catch(e){}
      state.quickKids = saved.filter(id => kids.some(k => k.id === id));
      if(!state.quickKids.length && kids.length === 1) state.quickKids = [kids[0].id];

    if(!kids.length) return `<div class="empty-note">Add a kid first (Manage tab).</div>`;
    const selected = quickSelectedKids(kids);
    const used = {};
    state.txns.forEach(t => { used[t.description] = (used[t.description] || 0) + 1; });
    const byUse = (a, b) => (used[b] || 0) - (used[a] || 0);
    const fines = state.fines.slice().sort((a, b) => byUse(a.title, b.title) || a.title.localeCompare(b.title));
    const awards = state.chores.slice().sort((a, b) => byUse(a.title, b.title) || a.title.localeCompare(b.title));
    const showFines = state.quickAllFines ? fines : fines.slice(0, 6);
    const showAwards = state.quickAllAwards ? awards : awards.slice(0, 6);

    }));
    app.querySelectorAll("[data-fine]").forEach(btn => btn.addEventListener("click", () => openFineSheet(btn.dataset.fine)));

    app.querySelectorAll("[data-edit-fine]").forEach(btn => btn.addEventListener("click", () => openCatalogSheet("fine", state.fines.find(f => f.id === btn.dataset.editFine))));
    app.querySelectorAll("[data-edit-reward]").forEach(btn => btn.addEventListener("click", () => openCatalogSheet("reward", state.rewards.find(r => r.id === btn.dataset.editReward))));
    const addChoreBtn = document.getElementById("addChoreBtn");
    if(addChoreBtn) addChoreBtn.addEventListener("click", () => openCatalogSheet("chore", null));
    const addFineBtn = document.getElementById("addFineBtn");
    if(addFineBtn) addFineBtn.addEventListener("click", () => openCatalogSheet("fine", null));
    const addRewardBtn = document.getElementById("addRewardBtn");
    if(addRewardBtn) addRewardBtn.addEventListener("click", () => openCatalogSheet("reward", null));
    app.querySelectorAll("[data-end-session]").forEach(btn => btn.addEventListener("click", () => {
      if(confirm("Stop this screen time session now?")) finishScreenSession(btn.dataset.endSession);
    }));
    const rateSaveBtn = document.getElementById("rateSave");
    if(rateSaveBtn) rateSaveBtn.addEventListener("click", () => {
      const rate = parseFloat(document.getElementById("rateInput").value);
      if(!rate || rate <= 0) return;
      setScreenTimeRate(rate);
    });
    // ---- Quick tab
    app.querySelectorAll("[data-quick-kid]").forEach(btn => btn.addEventListener("click", () => {
      const id = btn.dataset.quickKid;
      state.quickKids = (state.quickKids || []).includes(id)
        ? state.quickKids.filter(x => x !== id) : (state.quickKids || []).concat(id);
      try{ localStorage.setItem(QUICK_KIDS_KEY, JSON.stringify(state.quickKids)); }catch(e){}
      render();
    }));
    app.querySelectorAll("[data-quick-fine]").forEach(btn => btn.addEventListener("click", () => {
      const f = state.fines.find(x => x.id === btn.dataset.quickFine);
      if(f) quickIssue("fine", f.title, Number(f.amount), (state.quickKids || []).slice());
    }));
    app.querySelectorAll("[data-quick-award]").forEach(btn => btn.addEventListener("click", () => {
      const c = state.chores.find(x => x.id === btn.dataset.quickAward);
      if(c) quickIssue("award", c.title, Number(c.default_payout), (state.quickKids || []).slice());
    }));
    const moreFines = document.getElementById("quickMoreFines");
    if(moreFines) moreFines.addEventListener("click", () => { state.quickAllFines = !state.quickAllFines; render(); });
    const moreAwards = document.getElementById("quickMoreAwards");
    if(moreAwards) moreAwards.addEventListener("click", () => { state.quickAllAwards = !state.quickAllAwards; render(); });
    const quickCustom = document.getElementById("quickCustom");
    if(quickCustom) quickCustom.addEventListener("click", openQuickCustomSheet);
    const devYes = document.getElementById("devicePromptYes");
    if(devYes) devYes.addEventListener("click", () => {
      setDeviceProfile(state.activeMemberId);
      showToast("Done — this phone now opens straight here");
      render();
    });
    const devNo = document.getElementById("devicePromptNo");
    if(devNo) devNo.addEventListener("click", () => {
      try{ localStorage.setItem("mm_device_prompt_" + state.activeMemberId, "1"); }catch(e){}
      render();
    });

    // ---- Manage tab: profiles + this device
    app.querySelectorAll("[data-edit-member]").forEach(btn => btn.addEventListener("click", () => openEditMemberSheet(btn.dataset.editMember)));
    const addParentBtn = document.getElementById("addParentBtn");
    if(addParentBtn) addParentBtn.addEventListener("click", () => openAddMemberSheet("banker"));
    const deviceMgmt = document.getElementById("deviceProfileMgmt");
    if(deviceMgmt) deviceMgmt.addEventListener("click", () => {
      setDeviceProfile(getDeviceProfile() === state.activeMemberId ? null : state.activeMemberId);
      showToast(getDeviceProfile() ? "This device now opens straight to this profile" : "Back to asking who's using it");
      render();
    });

    const signOutBtn = document.getElementById("signOutBtn");
    if(signOutBtn) signOutBtn.addEventListener("click", async () => {
      if(!confirm("Sign out of this account on this device?")) return;
      clearInterval(autoRefreshInterval);
      setDeviceProfile(null);
      await supa.auth.signOut();
      state.activeMemberId = null;
      state.authUser = null;
      state.view = "login";
      render();
    });
    const acctSaveBtn = document.getElementById("acctSave");
    if(acctSaveBtn) acctSaveBtn.addEventListener("click", async () => {
      const emailInput = document.getElementById("acctEmail");
      const passwordInput = document.getElementById("acctPassword");
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if(!email){ markInvalid(emailInput, "Enter an email"); return; }
      if(password.length < 6){ markInvalid(passwordInput, "At least 6 characters"); return; }
      // Converts the current anonymous session into a permanent one under
      // the SAME user id — this household's data (which is all keyed to
      // that id) comes along for free instead of needing to be migrated.
      const { data, error } = await supa.auth.updateUser({ email, password });
      if(error){
        // Supabase blocks setting a password on an anonymous user until its
        // email is confirmed — which needs "Confirm email" turned OFF in
        // Authentication settings for a one-step save like this to work at
        // all (the confirmation-email path is also rate-limited hard on
        // Supabase's default mailer, so it's not a practical alternative
        // for this app). Point straight at the fix instead of just showing
        // Supabase's own confusing error text.
        const msg = /invalid|confirm|anonymous/i.test(error.message)
          ? `Couldn't save — turn off "Confirm email" under Authentication settings in Supabase, then try again.`
          : error.message;
        markInvalid(passwordInput, msg);
        return;
      }
      state.authUser = data.user;
      showToast("Login saved — this household is now reachable from anywhere");
      render();
    });
  }

  // Shared config for the three editable catalogs (chores/fines/rewards) so
  // one sheet + one save/archive path covers all three instead of three
  // near-identical forms.
  const CATALOG_CONFIG = {
    chore: { table: "chore_templates", label: "Chore", categoryField: "category",
      categoryOptions: ["Cleaning","Care & Kindness","Hygiene","Learning","Family Help","Finch"],
      amountField: "default_payout", amountLabel: "Payout ($)" },
    fine: { table: "fine_templates", label: "Fine", categoryField: "tier",
      categoryOptions: ["Big","Medium","Standard"],
      amountField: "amount", amountLabel: "Amount ($)" },
    reward: { table: "reward_items", label: "Reward", categoryField: "category",
      categoryOptions: ["Screen & Media","Food & Treats","Privileges & Fun","Tangible Rewards","Pets & Accessories"],
      amountField: "cost", amountLabel: "Cost ($)" }
  };

  function openCatalogSheet(kind, existing){
    const cfg = CATALOG_CONFIG[kind];
    const isEdit = !!existing;
    openSheet(`
      <div class="sheet-header"><h2>${isEdit ? "Edit" : "Add"} ${cfg.label}</h2><button class="sheet-close">&times;</button></div>
      <label class="field-label">Title</label>
      <input type="text" id="catTitle" value="${isEdit ? escapeHtml(existing.title) : ""}" />
      <label class="field-label">Category</label>
      <select id="catCategory">${cfg.categoryOptions.map(o => `<option value="${o}" ${isEdit && existing[cfg.categoryField] === o ? "selected" : ""}>${o}</option>`).join("")}</select>
      <label class="field-label">${cfg.amountLabel}</label>
      <input type="number" id="catAmount" step="0.25" value="${isEdit ? existing[cfg.amountField] : ""}" />
      <button class="primary-btn" id="catSave">${isEdit ? "Save changes" : `Add ${cfg.label.toLowerCase()}`}</button>
      ${isEdit ? `<button class="pill-btn outline" id="catArchive" style="width:100%;margin-top:10px;">Archive — remove from menu</button>` : ""}
    `, (overlay, close) => {
      const titleInput = overlay.querySelector("#catTitle");
      const amountInput = overlay.querySelector("#catAmount");
      titleInput.addEventListener("input", () => clearInvalid(titleInput));
      amountInput.addEventListener("input", () => clearInvalid(amountInput));
      overlay.querySelector("#catSave").addEventListener("click", async () => {
        const title = titleInput.value.trim();
        const category = overlay.querySelector("#catCategory").value;
        const amount = parseFloat(amountInput.value);
        if(!title){ markInvalid(titleInput, "Enter a title"); return; }
        if(!amount || amount <= 0){ markInvalid(amountInput, "Enter an amount greater than $0"); return; }
        const payload = { title, [cfg.categoryField]: category, [cfg.amountField]: amount };
        if(isEdit){
          await supa.from(cfg.table).update(payload).eq("id", existing.id);
        } else {
          await supa.from(cfg.table).insert(Object.assign({ household_id: userId }, payload));
        }
        showToast(`${cfg.label} ${isEdit ? "updated" : "added"}`);
        close(); reload();
      });
      const archiveBtn = overlay.querySelector("#catArchive");
      if(archiveBtn) archiveBtn.addEventListener("click", async () => {
        await supa.from(cfg.table).update({ archived: true }).eq("id", existing.id);
        showToast(`${cfg.label} archived`);
        close(); reload();
      });
    });
  }

  // ------------------------------------------------------------------ Sheets
  function openSheet(html, wireFn){
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<div class="sheet">${html}</div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add("open"));
    function close(){ overlay.classList.remove("open"); setTimeout(() => overlay.remove(), 150); }
    overlay.addEventListener("click", (e) => { if(e.target === overlay) close(); });
    const closeBtn = overlay.querySelector(".sheet-close");
    if(closeBtn) closeBtn.addEventListener("click", close);
    // On phones, the keyboard can cover a focused field (or the button below
    // it) inside a bottom sheet without the page itself needing to scroll —
    // nudge the focused field into view once the keyboard has room to open.
    overlay.querySelectorAll("input, select").forEach(el => {
      el.addEventListener("focus", () => {
        setTimeout(() => el.scrollIntoView({ block: "center", behavior: "smooth" }), 300);
      });
    });
    if(wireFn) wireFn(overlay, close);
  }

      <label class="field-label">Who is this?</label>
      <div class="choice-row">
        <button class="choice-chip${startRole === "kid" ? " selected" : ""}" data-role="kid">A kid</button>
        <button class="choice-chip${startRole === "banker" ? " selected" : ""}" data-role="banker">A parent (can fine &amp; award)</button>
      </div>
      <label class="field-label">Name</label>
      <input type="text" id="mName" placeholder="${startRole === "banker" ? "Dad" : "Sally"}" />
      <label class="field-label">Avatar</label>
      <div class="choice-row">${emojis.map((e,i) => `<button class="choice-chip${i===0?" selected":""}" data-emoji="${e}">${e}</button>`).join("")}</div>
      <label class="field-label">PIN (optional, 4 digits)</label>
      <input type="text" id="mPin" maxlength="4" inputmode="numeric" placeholder="e.g. 1234" />
      <button class="primary-btn" id="mSave">Add member</button>
    `, (overlay, close) => {
      let chosen = emojis[0], role = startRole;
      overlay.querySelectorAll("[data-emoji]").forEach(chip => chip.addEventListener("click", () => {
        overlay.querySelectorAll("[data-emoji]").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected"); chosen = chip.dataset.emoji;
      }));
      overlay.querySelectorAll("[data-role]").forEach(chip => chip.addEventListener("click", () => {
        overlay.querySelectorAll("[data-role]").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected"); role = chip.dataset.role;
      }));
      const nameInput = overlay.querySelector("#mName");
      nameInput.addEventListener("input", () => clearInvalid(nameInput));
      overlay.querySelector("#mSave").addEventListener("click", () => {
        const name = nameInput.value.trim();
        if(!name){ markInvalid(nameInput, "Enter a name first"); return; }
        const pin = overlay.querySelector("#mPin").value.trim();
        if(pin.length > 0 && pin.length !== 4){ markInvalid(overlay.querySelector("#mPin"), "PIN must be exactly 4 digits"); return; }
        addMember(name, role, chosen, pin.length === 4 ? pin : null);
        close();
      });
    });
  }

  // Rename / change PIN / change avatar for anyone. Mostly so the default
  // "Banker" profile can become "Mom" now that there is also a "Dad".
  function openEditMemberSheet(memberId){
    const m = member(memberId);
    if(!m) return;
    const emojis = ["🙂","👦","👧","🧒","👶","🦸","🐯","🌟","👨","👩"];
    openSheet(`
      <div class="sheet-header"><h2>Edit ${escapeHtml(m.name)}</h2><button class="sheet-close">&times;</button></div>
      <label class="field-label">Name</label>
      <input type="text" id="eName" value="${escapeHtml(m.name)}" />
      <label class="field-label">Avatar</label>
      <div class="choice-row">${emojis.map(e => `<button class="choice-chip${e === m.avatar_emoji ? " selected" : ""}" data-emoji="${e}">${e}</button>`).join("")}</div>
      <label class="field-label">PIN (4 digits, leave empty for none)</label>
      <input type="text" id="ePin" maxlength="4" inputmode="numeric" value="${escapeHtml(m.pin || "")}" />
      <button class="primary-btn" id="eSave">Save</button>
    `, (overlay, close) => {
      let chosen = m.avatar_emoji;
      overlay.querySelectorAll("[data-emoji]").forEach(chip => chip.addEventListener("click", () => {
        overlay.querySelectorAll("[data-emoji]").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected"); chosen = chip.dataset.emoji;
      }));
      const nameInput = overlay.querySelector("#eName");
      nameInput.addEventListener("input", () => clearInvalid(nameInput));
      overlay.querySelector("#eSave").addEventListener("click", async () => {
        const name = nameInput.value.trim();
        if(!name){ markInvalid(nameInput, "Enter a name"); return; }
        const pin = overlay.querySelector("#ePin").value.trim();
        if(pin.length > 0 && pin.length !== 4){ markInvalid(overlay.querySelector("#ePin"), "PIN must be exactly 4 digits"); return; }
        await supa.from("members").update({ name, avatar_emoji: chosen, pin: pin.length === 4 ? pin : null }).eq("id", m.id);
        showToast("Saved");
        close(); reload();
      });
    });
  }

  function openFineSheet(memberId){
    const m = member(memberId);
    openSheet(`
      <div class="sheet-header"><h2>Issue fine — ${escapeHtml(m.name)}</h2><button class="sheet-close">&times;</button></div>
      <div class="cat-label">Big Fines</div>
      <div class="choice-row">${state.fines.filter(f=>f.tier==="Big").map(f => `<button class="choice-chip" data-fine-id="${f.id}">${escapeHtml(f.title)} · ${fmt(f.amount)}</button>`).join("")}</div>
      <div class="cat-label">Medium Fines</div>
      <div class="choice-row">${state.fines.filter(f=>f.tier==="Medium").map(f => `<button class="choice-chip" data-fine-id="${f.id}">${escapeHtml(f.title)} · ${fmt(f.amount)}</button>`).join("")}</div>
      <div class="cat-label">Standard Fees</div>
      <div class="choice-row">${state.fines.filter(f=>f.tier==="Standard").map(f => `<button class="choice-chip" data-fine-id="${f.id}">${escapeHtml(f.title)} · ${fmt(f.amount)}</button>`).join("")}</div>
      <label class="field-label">Or a custom fine</label>
      <input type="text" id="fTitle" placeholder="Reason" />
      <input type="number" id="fAmount" placeholder="Amount" step="0.25" style="margin-top:8px;" />
      <button class="primary-btn" id="fSave">Charge fine</button>
    `, (overlay, close) => {
      let selectedFine = null;
      overlay.querySelectorAll("[data-fine-id]").forEach(chip => chip.addEventListener("click", () => {
        overlay.querySelectorAll("[data-fine-id]").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected");
        selectedFine = state.fines.find(f => f.id === chip.dataset.fineId);
        overlay.querySelector("#fTitle").value = selectedFine.title;
        overlay.querySelector("#fAmount").value = selectedFine.amount;
      }));
      const fTitleInput = overlay.querySelector("#fTitle");
      const fAmountInput = overlay.querySelector("#fAmount");
      fTitleInput.addEventListener("input", () => clearInvalid(fTitleInput));
      fAmountInput.addEventListener("input", () => clearInvalid(fAmountInput));
      overlay.querySelector("#fSave").addEventListener("click", () => {
        const title = fTitleInput.value.trim();
        const amount = parseFloat(fAmountInput.value);
        if(!title){ markInvalid(fTitleInput, "Pick a fine above or enter a reason"); return; }
        if(!amount || amount <= 0){ markInvalid(fAmountInput, "Enter an amount greater than $0"); return; }
        issueFine(selectedFine, memberId, title, amount).then(() => { showToast("Fine charged"); reload(); });
        close();
      });
    });
  }

  function openAssignSheet(memberId){
    const m = member(memberId);
    const byCat = {};
    state.chores.forEach(c => { (byCat[c.category] = byCat[c.category] || []).push(c); });
    let list = "";
    Object.keys(byCat).forEach(cat => {
      list += `<div class="cat-label">${escapeHtml(cat)}</div>`;
      byCat[cat].forEach(c => {
        list += `<div class="item-row"><div class="title">${escapeHtml(c.title)}</div><button class="pill-btn small" data-chore="${c.id}">${fmt(c.default_payout)}</button></div>`;
      });
    });
    openSheet(`
      <div class="sheet-header"><h2>Assign chore — ${escapeHtml(m.name)}</h2><button class="sheet-close">&times;</button></div>
      ${list}
    `, (overlay, close) => {
      overlay.querySelectorAll("[data-chore]").forEach(btn => btn.addEventListener("click", () => {
        assignChore(state.chores.find(c => c.id === btn.dataset.chore), memberId);
        close();
      }));
    });
  }

  function markInvalid(inputEl, msg){
    inputEl.classList.add("input-error");
    let msgEl = inputEl.nextElementSibling;
    if(!msgEl || !msgEl.classList.contains("field-error-msg")){
      msgEl = document.createElement("div");
      msgEl.className = "field-error-msg";
      inputEl.after(msgEl);
    }
    msgEl.textContent = msg;
    inputEl.focus();
  }
  function clearInvalid(inputEl){
    inputEl.classList.remove("input-error");
    const msgEl = inputEl.nextElementSibling;
    if(msgEl && msgEl.classList.contains("field-error-msg")) msgEl.remove();
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // ===========================================================================
  // Boot
  // ===========================================================================
  // Runs once we actually have a signed-in session (anonymous or real) —
  // shared by normal page load, "sign in", and "set up a new household",
  // so all three land on the same first-run/picker logic.
  async function afterSignedIn(session){
    userId = session.user.id;
    state.authUser = session.user;
    state.view = "picker";
    await reload();
    // First-ever visit: the new-household trigger seeds data right after
    // sign-up, which can lose a race with this initial fetch. One short
    // retry covers it without a visible loading state on every normal load.
    if(!state.members.length){
      await new Promise(r => setTimeout(r, 800));
      await reload();
    }
    // First-run wizard: a household with no kids yet (and that hasn't
    // finished setup on this device before) walks through adding kids and
    // PINs before ever seeing the Banker's Desk, instead of landing on a
    // bare profile picker with just "Banker" on it.
    let setupDone = false;
    try{ setupDone = !!localStorage.getItem(SETUP_DONE_KEY); }catch(e){}
    if(!state.members.some(m => m.role === "kid") && !setupDone){
      state.view = "setup";
    }
    // A device that was told "always open as Dad" skips the picker and PIN.
    // The home-screen "Quick Fine" shortcut (#quick) lands on the Quick tab.
    const deviceMember = getDeviceProfile() && member(getDeviceProfile());
    if(deviceMember && state.view !== "setup"){
      enterProfile(deviceMember);
      if(deviceMember.role === "banker" && location.hash === "#quick") state.kidTab = "quick";
    }
    render();
    startAutoRefresh();
  }

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }

  (async function boot(){
    app.innerHTML = `<div class="empty-note">Loading Momma Money…</div>`;
    const session = await initSupabase();
    if(!remoteReady){
      app.innerHTML = `<div class="empty-note">Couldn't connect — check your internet connection and reload.</div>`;
      return;
    }
    if(session) await afterSignedIn(session);
    else { state.view = "login"; render(); }
  })();
})();
</script>
</body>
</html>
