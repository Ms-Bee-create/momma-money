      approveTransaction(state.txns.find(t => t.id === btn.dataset.approve));
    }));
    app.querySelectorAll("[data-reject]").forEach(btn => btn.addEventListener("click", () => {
      rejectTransaction(state.txns.find(t => t.id === btn.dataset.reject));
    }));
    app.querySelectorAll("[data-fine]").forEach(btn => btn.addEventListener("click", () => openFineSheet(btn.dataset.fine)));
    app.querySelectorAll("[data-assign]").forEach(btn => btn.addEventListener("click", () => openAssignSheet(btn.dataset.assign)));
    app.querySelectorAll("[data-edit-chore]").forEach(btn => btn.addEventListener("click", () => openCatalogSheet("chore", state.chores.find(c => c.id === btn.dataset.editChore))));
    app.querySelectorAll("[data-edit-fine]").forEach(btn => btn.addEventListener("click", () => openCatalogSheet("fine", state.fines.find(f => f.id === btn.dataset.editFine))));
    app.querySelectorAll("[data-edit-reward]").forEach(btn => btn.addEventListener("click", () => openCatalogSheet("reward", state.rewards.find(r => r.id === btn.dataset.editReward))));
    const addChoreBtn = document.getElementById("addChoreBtn");
    if(addChoreBtn) addChoreBtn.addEventListener("click", () => openCatalogSheet("chore", null));
    const addFineBtn = document.getElementById("addFineBtn");
    if(addFineBtn) addFineBtn.addEventListener("click", () => openCatalogSheet("fine", null));
    const addRewardBtn = document.getElementById("addRewardBtn");
    if(addRewardBtn) addRewardBtn.addEventListener("click", () => openCatalogSheet("reward", null));
    app.querySelectorAll("[data-end-session]").forEach(btn => btn.addEventListener("click", () => {
      if(confirm("Stop this screen time session now?")) finishScreenSession(btn.dataset.endSession);
    }));
    const rateSaveBtn = document.getElementById("rateSave");
    if(rateSaveBtn) rateSaveBtn.addEventListener("click", () => {
      const rate = parseFloat(document.getElementById("rateInput").value);
      if(!rate || rate <= 0) return;
      setScreenTimeRate(rate);
    });
    // ---- Quick tab
    app.querySelectorAll("[data-quick-kid]").forEach(btn => btn.addEventListener("click", () => {
      const id = btn.dataset.quickKid;
      state.quickKids = (state.quickKids || []).includes(id)
        ? state.quickKids.filter(x => x !== id) : (state.quickKids || []).concat(id);
      try{ localStorage.setItem(QUICK_KIDS_KEY, JSON.stringify(state.quickKids)); }catch(e){}
      render();
    }));
    app.querySelectorAll("[data-quick-fine]").forEach(btn => btn.addEventListener("click", () => {
      const f = state.fines.find(x => x.id === btn.dataset.quickFine);
      if(f) quickIssue("fine", f.title, Number(f.amount), (state.quickKids || []).slice());
    }));
    app.querySelectorAll("[data-quick-award]").forEach(btn => btn.addEventListener("click", () => {
      const c = state.chores.find(x => x.id === btn.dataset.quickAward);
      if(c) quickIssue("award", c.title, Number(c.default_payout), (state.quickKids || []).slice());
    }));
    const moreFines = document.getElementById("quickMoreFines");
    if(moreFines) moreFines.addEventListener("click", () => { state.quickAllFines = !state.quickAllFines; render(); });
    const moreAwards = document.getElementById("quickMoreAwards");
    if(moreAwards) moreAwards.addEventListener("click", () => { state.quickAllAwards = !state.quickAllAwards; render(); });
    const quickCustom = document.getElementById("quickCustom");
    if(quickCustom) quickCustom.addEventListener("click", openQuickCustomSheet);
    const devYes = document.getElementById("devicePromptYes");
    if(devYes) devYes.addEventListener("click", () => {
      setDeviceProfile(state.activeMemberId);
      showToast("Done — this phone now opens straight here");
      render();
    });
    const devNo = document.getElementById("devicePromptNo");
    if(devNo) devNo.addEventListener("click", () => {
      try{ localStorage.setItem("mm_device_prompt_" + state.activeMemberId, "1"); }catch(e){}
      render();
    });

    // ---- Manage tab: profiles + this device
    app.querySelectorAll("[data-edit-member]").forEach(btn => btn.addEventListener("click", () => openEditMemberSheet(btn.dataset.editMember)));
    const addParentBtn = document.getElementById("addParentBtn");
    if(addParentBtn) addParentBtn.addEventListener("click", () => openAddMemberSheet("banker"));
    const deviceMgmt = document.getElementById("deviceProfileMgmt");
    if(deviceMgmt) deviceMgmt.addEventListener("click", () => {
      setDeviceProfile(getDeviceProfile() === state.activeMemberId ? null : state.activeMemberId);
      showToast(getDeviceProfile() ? "This device now opens straight to this profile" : "Back to asking who's using it");
      render();
    });

    const signOutBtn = document.getElementById("signOutBtn");
    if(signOutBtn) signOutBtn.addEventListener("click", async () => {
      if(!confirm("Sign out of this account on this device?")) return;
      clearInterval(autoRefreshInterval);
      setDeviceProfile(null);
      await supa.auth.signOut();
      state.activeMemberId = null;
      state.authUser = null;
      state.view = "login";
      render();
    });
    const acctSaveBtn = document.getElementById("acctSave");
    if(acctSaveBtn) acctSaveBtn.addEventListener("click", async () => {
      const emailInput = document.getElementById("acctEmail");
      const passwordInput = document.getElementById("acctPassword");
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if(!email){ markInvalid(emailInput, "Enter an email"); return; }
      if(password.length < 6){ markInvalid(passwordInput, "At least 6 characters"); return; }
      // Converts the current anonymous session into a permanent one under
      // the SAME user id — this household's data (which is all keyed to
      // that id) comes along for free instead of needing to be migrated.
      const { data, error } = await supa.auth.updateUser({ email, password });
      if(error){
        // Supabase blocks setting a password on an anonymous user until its
        // email is confirmed — which needs "Confirm email" turned OFF in
        // Authentication settings for a one-step save like this to work at
        // all (the confirmation-email path is also rate-limited hard on
        // Supabase's default mailer, so it's not a practical alternative
        // for this app). Point straight at the fix instead of just showing
        // Supabase's own confusing error text.
        const msg = /invalid|confirm|anonymous/i.test(error.message)
          ? `Couldn't save — turn off "Confirm email" under Authentication settings in Supabase, then try again.`
          : error.message;
        markInvalid(passwordInput, msg);
        return;
      }
      state.authUser = data.user;
      showToast("Login saved — this household is now reachable from anywhere");
      render();
    });
  }

  // Shared config for the three editable catalogs (chores/fines/rewards) so
  // one sheet + one save/archive path covers all three instead of three
  // near-identical forms.
  const CATALOG_CONFIG = {
    chore: { table: "chore_templates", label: "Chore", categoryField: "category",
      categoryOptions: ["Cleaning","Care & Kindness","Hygiene","Learning","Family Help","Finch"],
      amountField: "default_payout", amountLabel: "Payout ($)" },
    fine: { table: "fine_templates", label: "Fine", categoryField: "tier",
      categoryOptions: ["Big","Medium","Standard"],
      amountField: "amount", amountLabel: "Amount ($)" },
    reward: { table: "reward_items", label: "Reward", categoryField: "category",
      categoryOptions: ["Screen & Media","Food & Treats","Privileges & Fun","Tangible Rewards","Pets & Accessories"],
      amountField: "cost", amountLabel: "Cost ($)" }
  };

  function openCatalogSheet(kind, existing){
    const cfg = CATALOG_CONFIG[kind];
    const isEdit = !!existing;
    openSheet(`
      <div class="sheet-header"><h2>${isEdit ? "Edit" : "Add"} ${cfg.label}</h2><button class="sheet-close">&times;</button></div>
      <label class="field-label">Title</label>
      <input type="text" id="catTitle" value="${isEdit ? escapeHtml(existing.title) : ""}" />
      <label class="field-label">Category</label>
      <select id="catCategory">${cfg.categoryOptions.map(o => `<option value="${o}" ${isEdit && existing[cfg.categoryField] === o ? "selected" : ""}>${o}</option>`).join("")}</select>
      <label class="field-label">${cfg.amountLabel}</label>
      <input type="number" id="catAmount" step="0.25" value="${isEdit ? existing[cfg.amountField] : ""}" />
      <button class="primary-btn" id="catSave">${isEdit ? "Save changes" : `Add ${cfg.label.toLowerCase()}`}</button>
      ${isEdit ? `<button class="pill-btn outline" id="catArchive" style="width:100%;margin-top:10px;">Archive — remove from menu</button>` : ""}
    `, (overlay, close) => {
      const titleInput = overlay.querySelector("#catTitle");
      const amountInput = overlay.querySelector("#catAmount");
      titleInput.addEventListener("input", () => clearInvalid(titleInput));
      amountInput.addEventListener("input", () => clearInvalid(amountInput));
      overlay.querySelector("#catSave").addEventListener("click", async () => {
        const title = titleInput.value.trim();
        const category = overlay.querySelector("#catCategory").value;
        const amount = parseFloat(amountInput.value);
        if(!title){ markInvalid(titleInput, "Enter a title"); return; }
        if(!amount || amount <= 0){ markInvalid(amountInput, "Enter an amount greater than $0"); return; }
        const payload = { title, [cfg.categoryField]: category, [cfg.amountField]: amount };
        if(isEdit){
          await supa.from(cfg.table).update(payload).eq("id", existing.id);
        } else {
          await supa.from(cfg.table).insert(Object.assign({ household_id: userId }, payload));
        }
        showToast(`${cfg.label} ${isEdit ? "updated" : "added"}`);
        close(); reload();
      });
      const archiveBtn = overlay.querySelector("#catArchive");
      if(archiveBtn) archiveBtn.addEventListener("click", async () => {
        await supa.from(cfg.table).update({ archived: true }).eq("id", existing.id);
        showToast(`${cfg.label} archived`);
        close(); reload();
      });
    });
  }

  // ------------------------------------------------------------------ Sheets
  function openSheet(html, wireFn){
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<div class="sheet">${html}</div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add("open"));
    function close(){ overlay.classList.remove("open"); setTimeout(() => overlay.remove(), 150); }
    overlay.addEventListener("click", (e) => { if(e.target === overlay) close(); });
    const closeBtn = overlay.querySelector(".sheet-close");
    if(closeBtn) closeBtn.addEventListener("click", close);
    // On phones, the keyboard can cover a focused field (or the button below
    // it) inside a bottom sheet without the page itself needing to scroll —
    // nudge the focused field into view once the keyboard has room to open.
    overlay.querySelectorAll("input, select").forEach(el => {
      el.addEventListener("focus", () => {
        setTimeout(() => el.scrollIntoView({ block: "center", behavior: "smooth" }), 300);
      });
    });
    if(wireFn) wireFn(overlay, close);
  }

      <input type="text" id="eName" value="${escapeHtml(m.name)}" />
      <label class="field-label">Avatar</label>
      <div class="choice-row">${emojis.map(e => `<button class="choice-chip${e === m.avatar_emoji ? " selected" : ""}" data-emoji="${e}">${e}</button>`).join("")}</div>
      <label class="field-label">PIN (4 digits, leave empty for none)</label>
      <input type="text" id="ePin" maxlength="4" inputmode="numeric" value="${escapeHtml(m.pin || "")}" />
      <button class="primary-btn" id="eSave">Save</button>
    `, (overlay, close) => {
      let chosen = m.avatar_emoji;
      overlay.querySelectorAll("[data-emoji]").forEach(chip => chip.addEventListener("click", () => {
        overlay.querySelectorAll("[data-emoji]").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected"); chosen = chip.dataset.emoji;
      }));
      const nameInput = overlay.querySelector("#eName");
      nameInput.addEventListener("input", () => clearInvalid(nameInput));
      overlay.querySelector("#eSave").addEventListener("click", async () => {
        const name = nameInput.value.trim();
        if(!name){ markInvalid(nameInput, "Enter a name"); return; }
        const pin = overlay.querySelector("#ePin").value.trim();
        if(pin.length > 0 && pin.length !== 4){ markInvalid(overlay.querySelector("#ePin"), "PIN must be exactly 4 digits"); return; }
        await supa.from("members").update({ name, avatar_emoji: chosen, pin: pin.length === 4 ? pin : null }).eq("id", m.id);
        showToast("Saved");
        close(); reload();
      });
    });
  }

  function openFineSheet(memberId){
    const m = member(memberId);
    openSheet(`
      <div class="sheet-header"><h2>Issue fine — ${escapeHtml(m.name)}</h2><button class="sheet-close">&times;</button></div>
      <div class="cat-label">Big Fines</div>
      <div class="choice-row">${state.fines.filter(f=>f.tier==="Big").map(f => `<button class="choice-chip" data-fine-id="${f.id}">${escapeHtml(f.title)} · ${fmt(f.amount)}</button>`).join("")}</div>
      <div class="cat-label">Medium Fines</div>
      <div class="choice-row">${state.fines.filter(f=>f.tier==="Medium").map(f => `<button class="choice-chip" data-fine-id="${f.id}">${escapeHtml(f.title)} · ${fmt(f.amount)}</button>`).join("")}</div>
      <div class="cat-label">Standard Fees</div>
      <div class="choice-row">${state.fines.filter(f=>f.tier==="Standard").map(f => `<button class="choice-chip" data-fine-id="${f.id}">${escapeHtml(f.title)} · ${fmt(f.amount)}</button>`).join("")}</div>
      <label class="field-label">Or a custom fine</label>
      <input type="text" id="fTitle" placeholder="Reason" />
      <input type="number" id="fAmount" placeholder="Amount" step="0.25" style="margin-top:8px;" />
      <button class="primary-btn" id="fSave">Charge fine</button>
    `, (overlay, close) => {
      let selectedFine = null;
      overlay.querySelectorAll("[data-fine-id]").forEach(chip => chip.addEventListener("click", () => {
        overlay.querySelectorAll("[data-fine-id]").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected");
        selectedFine = state.fines.find(f => f.id === chip.dataset.fineId);
        overlay.querySelector("#fTitle").value = selectedFine.title;
        overlay.querySelector("#fAmount").value = selectedFine.amount;
      }));
      const fTitleInput = overlay.querySelector("#fTitle");
      const fAmountInput = overlay.querySelector("#fAmount");
      fTitleInput.addEventListener("input", () => clearInvalid(fTitleInput));
      fAmountInput.addEventListener("input", () => clearInvalid(fAmountInput));
      overlay.querySelector("#fSave").addEventListener("click", () => {
        const title = fTitleInput.value.trim();
        const amount = parseFloat(fAmountInput.value);
        if(!title){ markInvalid(fTitleInput, "Pick a fine above or enter a reason"); return; }
        if(!amount || amount <= 0){ markInvalid(fAmountInput, "Enter an amount greater than $0"); return; }
        issueFine(selectedFine, memberId, title, amount).then(() => { showToast("Fine charged"); reload(); });
        close();
      });
    });
  }

  function openAssignSheet(memberId){
    const m = member(memberId);
    const byCat = {};
    state.chores.forEach(c => { (byCat[c.category] = byCat[c.category] || []).push(c); });
    let list = "";
    Object.keys(byCat).forEach(cat => {
      list += `<div class="cat-label">${escapeHtml(cat)}</div>`;
      byCat[cat].forEach(c => {
        list += `<div class="item-row"><div class="title">${escapeHtml(c.title)}</div><button class="pill-btn small" data-chore="${c.id}">${fmt(c.default_payout)}</button></div>`;
      });
    });
    openSheet(`
      <div class="sheet-header"><h2>Assign chore — ${escapeHtml(m.name)}</h2><button class="sheet-close">&times;</button></div>
      ${list}
    `, (overlay, close) => {
      overlay.querySelectorAll("[data-chore]").forEach(btn => btn.addEventListener("click", () => {
        assignChore(state.chores.find(c => c.id === btn.dataset.chore), memberId);
        close();
      }));
    });
  }

  function markInvalid(inputEl, msg){
    inputEl.classList.add("input-error");
    let msgEl = inputEl.nextElementSibling;
    if(!msgEl || !msgEl.classList.contains("field-error-msg")){
      msgEl = document.createElement("div");
      msgEl.className = "field-error-msg";
      inputEl.after(msgEl);
    }
    msgEl.textContent = msg;
    inputEl.focus();
  }
  function clearInvalid(inputEl){
    inputEl.classList.remove("input-error");
    const msgEl = inputEl.nextElementSibling;
    if(msgEl && msgEl.classList.contains("field-error-msg")) msgEl.remove();
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // ===========================================================================
  // Boot
  // ===========================================================================
  // Runs once we actually have a signed-in session (anonymous or real) —
  // shared by normal page load, "sign in", and "set up a new household",
  // so all three land on the same first-run/picker logic.
  async function afterSignedIn(session){
    userId = session.user.id;
    state.authUser = session.user;
    state.view = "picker";
    await reload();
    // First-ever visit: the new-household trigger seeds data right after
    // sign-up, which can lose a race with this initial fetch. One short
    // retry covers it without a visible loading state on every normal load.
    if(!state.members.length){
      await new Promise(r => setTimeout(r, 800));
      await reload();
    }
    // First-run wizard: a household with no kids yet (and that hasn't
    // finished setup on this device before) walks through adding kids and
    // PINs before ever seeing the Banker's Desk, instead of landing on a
    // bare profile picker with just "Banker" on it.
    let setupDone = false;
    try{ setupDone = !!localStorage.getItem(SETUP_DONE_KEY); }catch(e){}
    if(!state.members.some(m => m.role === "kid") && !setupDone){
      state.view = "setup";
    }
    // A device that was told "always open as Dad" skips the picker and PIN.
    // The home-screen "Quick Fine" shortcut (#quick) lands on the Quick tab.
    const deviceMember = getDeviceProfile() && member(getDeviceProfile());
    if(deviceMember && state.view !== "setup"){
      enterProfile(deviceMember);
      if(deviceMember.role === "banker" && location.hash === "#quick") state.kidTab = "quick";
    }
    render();
    startAutoRefresh();
  }

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }

  (async function boot(){
    app.innerHTML = `<div class="empty-note">Loading Momma Money…</div>`;
    const session = await initSupabase();
    if(!remoteReady){
      app.innerHTML = `<div class="empty-note">Couldn't connect — check your internet connection and reload.</div>`;
      return;
    }
    if(session) await afterSignedIn(session);
    else { state.view = "login"; render(); }
  })();
})();
</script>
</body>
</html>
